name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        # Sentinel values (not real secrets) so the bundle search below can look for the values themselves.
        env:
          SUPABASE_URL: https://ci-sentinel.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-sentinel-service-role-key-2b9d
          CLERK_SECRET_KEY: sk_test_ci_sentinel_7c41
      - name: Search client bundle for secrets
        run: npm run check:bundle
        env:
          SUPABASE_SERVICE_ROLE_KEY: ci-sentinel-service-role-key-2b9d
          CLERK_SECRET_KEY: sk_test_ci_sentinel_7c41
