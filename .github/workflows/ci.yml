name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      # Database tests: migrations, row-level security, insert-only records, seed.
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: SQL Editor bundle is up to date
        run: node scripts/bundle-migrations.mjs --check
      - name: Database tests (Postgres 17)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      # Throwaway random values (not real credentials), new on every run, so the searches below
      # can look for the values themselves. The build is given them and must not keep them.
      - name: Generate test secrets
        run: |
          rnd() { openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | head -c 40; }
          for pair in "SUPABASE_SERVICE_ROLE_KEY=$(rnd)" "CLERK_SECRET_KEY=sk_test_$(rnd)" "CLERK_WEBHOOK_SIGNING_SECRET=whsec_$(rnd)"; do
            echo "::add-mask::${pair#*=}"
            echo "$pair" >> "$GITHUB_ENV"
          done
          echo "SUPABASE_URL=https://ci-test.supabase.co" >> "$GITHUB_ENV"
          echo "OWNER_EMAIL=owner@example.com" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=pk_test_$(printf 'ci-test.clerk.accounts.dev$' | base64)" >> "$GITHUB_ENV"
      - name: Build (secrets removed from the build environment)
        run: npm run build
      - name: Search build output and .next/cache for secret values
        run: npm run check:build-secrets
      - name: Search client bundle for secrets
        run: npm run check:bundle
