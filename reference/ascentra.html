  if(d.step==="why") body = `<h2 class="ivq">Why a diagnostic?</h2><p class="read">So your academy starts where you are, not at the beginning of everything. It takes about five minutes. There's no pass or fail, and your answers only shape your Blueprint.</p><ul class="list"><li>How confident you feel</li><li>Four short questions, adjusted to your answers</li><li>Putting steps in order</li><li>One short written scenario</li><li>An optional example of your work</li></ul>${fallback?notice("warn","info","This goal doesn't have its own question set in the prototype, so the diagnostic uses the closest available set."):""}<div>${btn("Start","diagGo","conf",{cls:"primary",id:"dgStart"})}</div>`;
  if(d.step==="conf") body = `<h2 class="ivq">How confident do you feel with each of these?</h2><p class="muted">Confidence isn't proof, and that's fine. The next parts check it gently.</p><div class="stack">${B.skills.map(([k,l])=>`<div class="slider wide"><label for="dc_${k}">${esc(l)}</label><input type="range" id="dc_${k}" min="1" max="5" value="${d.conf[k]||3}" data-change="diagConf" data-arg="${k}"><span class="small">${["","Not yet","A little","Somewhat","Fairly","Very"][d.conf[k]||3]}</span></div>`).join("")}</div><div>${btn("Continue","diagConfNext",null,{cls:"primary",id:"dgConf"})}</div>`;
  if(d.step==="mcq"){ const id = d.cur || B.start, it = B.items[id], ans = d.shown ? d.path[d.path.length-1] : null, qn = d.path.length + (d.shown?0:1);

      ${ans?`<p class="read" role="status"><b>Here's the reasoning.</b> ${esc(it.why)}</p><div>${btn("Next","diagNext",null,{cls:"primary",id:"dgNext"})}</div>`:""}`; }
  if(d.step==="order"){ const items = B.order.items;
    body = `<h2 class="ivq">${esc(B.order.prompt)}</h2><p class="muted">Use the arrows to move a step up or down.</p><ol class="orderlist">${d.order.map((v,i)=>`<li class="${d.orderChecked?(v===i?"ok":"no"):""}"><span class="num">${i+1}</span><span>${esc(items[v])}</span><span class="row">${d.orderChecked?(v===i?`<span aria-label="In the right place">✓</span>`:`<span class="small muted">belongs at ${v+1}</span>`):`${btn("↑","diagMove",i+"|-1",{cls:"small ghost",disabled:i===0})}${btn("↓","diagMove",i+"|1",{cls:"small ghost",disabled:i===d.order.length-1})}`.replace(/>↑</,' aria-label="Move up">↑<').replace(/>↓</,' aria-label="Move down">↓<')}</span></li>`).join("")}</ol>
      ${d.orderChecked?`<p class="read" role="status">${d.order.filter((v,i)=>v===i).length} of 5 in place. ${esc(B.order.why)}</p><div>${btn("Continue","diagGo","scen",{cls:"primary",id:"dgOrderNext"})}</div>`:`<div>${btn("Check my order","diagOrder",null,{cls:"primary",id:"dgOrder"})}</div>`}`; }
  if(d.step==="scen"){ const hits = B.scen.signals.map(s=>s[1].test(d.scen));

        :`<div class="row">${btn("Check my answer","diagScen",null,{cls:"primary",id:"dgScen"})}${btn("Skip","diagGo","upload",{cls:"ghost",id:"dgScenSkip"})}</div>`}`; }
  if(d.step==="upload") body = `<h2 class="ivq">Share an example of your work (optional)</h2><p class="read">A past ad, a script, a spreadsheet, anything that shows how you work today.</p><div class="field"><label for="dg_file">Choose a file</label><input type="file" id="dg_file" data-change="diagFile"></div>

  if(d.step==="profile"){ const pr = d.profile = diagProfile(o); const grp = (lvl, title, desc) => { const l = pr.skills.filter(s=>s.lvl===lvl); return `<section class="panel"><div class="panel-head"><h3>${title}</h3><span class="small muted">${l.length}</span></div><p class="small muted">${desc}</p>${l.map(s=>`<div class="row" style="justify-content:space-between"><span>${esc(s.label)}</span>${s.priority?tag("doc","★","Priority"):""}</div>`).join("")||`<p class="small muted">None</p>`}</section>`; };

    body = `<h2 class="ivq">Your starting profile</h2><p class="read">Starting level: <b>${esc(pr.start)}</b>. This shapes your Blueprint. It isn't a score.</p>${notes.length?`<ul class="list">${notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}

      <div class="row">${btn("See your recommended Blueprint","diagToBp",null,{cls:"primary",id:"dgToBp"})}${btn("Save and exit","onbExit",null,{cls:"ghost"})}</div>`; }
  return `${head}<section class="ivwrap">${body}</section>`;
};

function adminShell(route, p){
  const acc = me(), [sec, sub] = (p||"").split("/");
  const list = ADMIN_SECTIONS.filter(s=>sectionAllowed(acc,s[0]));
  const cur = sec || (list[0]&&list[0][0]);
  const title = route==="command" ? "Founder Command Center" : "Admin Console";
  let body;
  if(!SECTION[cur]) body = restrictedCard("Section not found","That area doesn't exist.");

      cur==="admins"||cur==="ownerAcademy" ? "Only the Owner can open "+esc(SECTION[cur].label)+". "+esc(acc.name)+" is "+esc(roleLabel(acc))+". Administrator roles can be granted, changed, or revoked only by the Owner." : esc(SECTION[cur].label)+" isn't assigned to "+esc(roleLabel(acc))+". Ask the Owner if your role should include it.",
      list.length?goBtn("Go to "+esc(list[0][1]),route,list[0][0],{cls:"small"}):"");
  else body = (SEC[cur]||(()=>""))(sub, route);
  if(S.lastDenied!==route+"|"+cur && SECTION[cur] && !sectionAllowed(acc,cur)){ S.lastDenied = route+"|"+cur; audit("Blocked access to "+SECTION[cur].label,"Permission required · no change made"); }
  return `${hero(route==="command"?"Owner · "+esc(acc.name):esc(roleLabel(acc))+" · assigned areas only", title, route==="command"?"Operational controls for the platform. Nothing here connects to production systems.":"You see only the areas assigned to your role.")}

    <nav class="admin-nav" aria-label="${title} sections">${list.map(([k,l])=>`<button type="button" data-act="go" data-arg="${route}|${k}" id="sec_${k}" ${k===cur?'aria-current="page"':""}><span>${esc(l)}</span>${k==="admins"||k==="ownerAcademy"?ico("lock"):""}</button>`).join("")}</nav>

let pendingScroll = null;
let rendering = false, rerender = false;
function render(opts){
  if(rendering){ rerender = true; return; }
  rendering = true;
  try{ renderInner(opts); } finally { rendering = false; }
  if(rerender){ rerender = false; setTimeout(()=>render(), 0); }
}
function renderInner(opts){
  const active = document.activeElement && document.activeElement.id;
  applyPrefs(); renderProtobar(); renderSide(); renderTop(); renderMain(); renderTabbar(); save(); afterRender(); normalizeHeadings();
  if(pendingScroll!=null){ const y = pendingScroll; pendingScroll = null; requestAnimationFrame(()=>window.scrollTo(0,y)); $("#main").focus({preventScroll:true}); return; }
  if(opts && opts.focusMain){ window.scrollTo(0,0); $("#main").focus({preventScroll:true}); return; }
  if(active){ const el = document.getElementById(active); if(el) el.focus({preventScroll:true}); }
}
function go(v, p, opts){
  opts = opts||{};
  if(opts.push!==false && (S.view!==v || S.param!==p)){ S.hist.push({v:S.view,p:S.param,y:window.scrollY}); if(S.hist.length>30) S.hist.shift(); }

  closeLayer(); render({focusMain:true}); uiBlip(); seqOnRoute(v, S.param);
  if(S.preview==="loading") scheduleLoad();
}
function back(){
  const h = S.hist.pop();
  if(!h){ const c = crumbsFor(S.view,S.param); const t = c.length>1 ? c[c.length-2] : [null,homeOf(me()),null]; go(t[1], t[2], {push:false}); return; }
  S.view = h.v; S.param = h.p; pendingScroll = h.y; closeLayer(); render();
}

function audioApply(){

  if(AUD.world!==S.world){ AUD.nodes.forEach(n=>{ try{ n.stop(now+.4); }catch(e){} }); AUD.nodes = audioGraph(); AUD.world = S.world; }

const LIFE = {

/* ---------- entitlement (replaces the Stage 1 version; same shape, one source of truth) ---------- */
function entitlement(acc){

/* ---------- lifecycle transitions ---------- */
function hist(sub, t, amt){ sub.history.unshift({at:sub.clock, t, amt:amt==null?null:amt}); }
let refN = 0; function newRef(p){ refN = (refN+1)%900; return p+"-"+(1100+Math.floor(Math.random()*8000)+refN); }
function nextEvent(sub){

    if(!sub.cancelAtEnd && sub.reminder!=="sent" && diffD(sub.clock, t.remind)>0) return {at:t.remind, kind:"reminder", label:"Send the trial reminder ("+fd(t.remind)+")"};

const _notesS4 = notificationsFor;
notificationsFor = function(acc){
  const base = _notesS4(acc).filter(n=>!/^Trial reminder|^Basic renews/.test(n[0])), out = [], sub = acc.kind==="guardian" ? subOf(ACCOUNTS[acc.teen]) : subOf(acc);
  if(sub){ const k = lifeKey(sub), who = acc.kind==="guardian" ? ACCOUNTS[acc.teen].name+"'s " : "";
    if(k==="trialReminder") out.push(["Trial reminder: first charge "+(sub.pending?"$50.00":"$20.00")+" on "+fd(trialInfo(sub).end)+".","Simulated reminder. Cancel before then to avoid the charge."]);
    else if(k==="trial") out.push([who+"Trial reminder scheduled for "+fd(trialInfo(sub).remind)+".","First charge $20.00 on "+fd(trialInfo(sub).end)+". Simulated."]);
    else if(k==="failed") out.push(["Payment failed for "+who+"plan.","Update the payment method by "+fd(sub.failed.graceEnd)+". Access continues until then."]);
    else if(k==="canceled"||k==="trialCanceled") out.push([who+(k==="trialCanceled"?"Trial":"Subscription")+" canceled.","Access continues through "+fd(accessThrough(sub))+". Reference "+(sub.cancelRef||"")+"."]);
    else if(k==="expired") out.push([who+"Plan ended.","Progress is kept. Resubscribe any time."]);
    else if(k==="pending" && acc.kind==="guardian") out.push([ACCOUNTS[acc.teen].name+" invited you to authorize their account.","Review and authorize in the Guardian Center."]);
    else if(sub.periodEnd && acc.id===sub.payer) out.push([(sub.plan==="pro"?"Pro":"Basic")+" renews on "+fd(sub.periodEnd)+" for "+usd(PRICE[sub.plan])+".","Simulated reminder."]); }
  const s = acc.kind==="guardian" ? S.sec[acc.teen] : S.sec[acc.id];
  if(s && s.level>=2) out.push([ENF[s.level][1]+" on "+(acc.kind==="guardian"?ACCOUNTS[acc.teen].name+"'s":"your")+" account.","See Devices and security for the reason and how to appeal."]);
  if(acc.kind==="guardian" && ((S.safety||{})[acc.teen]||[]).some(x=>!x.ack)) out.push(["Safety alert for "+ACCOUNTS[acc.teen].name+".","Open Safety & Support for the reason and what was done."]);
  return out.concat(base);
};

const CTABS = [["overview","Structure and versions"],["blueprint","Blueprint"],["modules","Modules and lessons"],["map","Skill map"],["activities","Activities and assessments"],["sources","Sources and claims"],["preview","Preview"]];
const ACT_TYPES = ["Explainer","Watch","Quiz","Lab","Assignment","Flashcards","Scenario","Mastery check"];
const V_STATE = {Draft:["prog","◐"],Review:["warn","!"],Published:["ok","✓"],Archived:["lock","⊠"],Restored:["ok","↺"]};
function vTag(s){ const t = V_STATE[s]||["doc","·"]; return tag(t[0],t[1],s); }
function liveVersion(cid){ return (S.courseVersions[cid]||[]).filter(v=>v.status==="Published"||v.status==="Restored").slice(-1)[0]; }
function openVersion(cid){ return (S.courseVersions[cid]||[]).find(v=>v.status==="Draft"||v.status==="Review"); }
function nextV(cid){ const vs = S.courseVersions[cid]||[], last = vs[vs.length-1]; if(!last) return "1.0"; const [a,b] = last.v.split(".").map(Number); return a+"."+(b+1); }
function cdOf(cid){ S.cdraft = S.cdraft||{};
  if(!S.cdraft[cid]){ const ac = ACADEMIES[cid], bp = BLUEPRINTS[cid]||{};
    S.cdraft[cid] = {bp:{outcome:ac.outcome||"", schedule:bp.schedule||ac.cadence||"", capstone:bp.capstone||""},
      mods:ac.modules.map(m=>({id:m.id,title:m.title,stage:stageOf(ac,m)||"Foundation",prereq:(m.prereq||[]).slice(),lessons:LESSONS[m.id]?[LESSONS[m.id].title]:["Lesson 1"],acts:[{type:"Explainer",pass:null},{type:"Quiz",pass:80},{type:"Lab",pass:null}],src:[]})),
      claims:Object.values(SOURCES).filter(s=>s.academy===cid).map(s=>({src:s.id, mod:(Object.values(CONFLICTS).find(c=>c.a===s.id||c.b===s.id)||{}).module||"", state:s.claim?"proposed":"approved"})), changes:[]};
    (S.builderDraft[cid]||[]).forEach((t,i)=>S.cdraft[cid].mods.push({id:"n"+i,title:t,stage:"Application",prereq:[],lessons:["Lesson 1"],acts:[{type:"Quiz",pass:80}],src:[]})); }
  return S.cdraft[cid]; }
function canEditCourse(acc, cid){ return can(acc,"editCourses") && courseAllowed(acc,cid) && cid!=="gsa"; }
function canPublishCourse(acc, cid){ return can(acc,"publishCourses") && courseAllowed(acc,cid) && cid!=="gsa"; }

function draftGuard(acc, cid){ const ov = openVersion(cid); if(!canEditCourse(acc,cid)) return `<p class="small muted">${badge("restricted")} Your role can view this course but not edit it.</p>`; if(!ov||ov.status!=="Draft") return notice("warn","info",`Edits happen in a draft. ${ov?"v"+esc(ov.v)+" is in review; return it to draft to edit.":btn("Create draft version","courseDraft",cid,{cls:"small",id:"bDraft"})}`); return ""; }

    ${d.map(m=>`<g><rect x="${pos[m.id][0]}" y="${pos[m.id][1]}" width="160" height="36" rx="8" fill="var(--c-surface-2)" stroke="var(--c-line)"/><text x="${pos[m.id][0]+10}" y="${pos[m.id][1]+22}" fill="var(--c-text)" font-size="12">${esc(m.title.length>24?m.title.slice(0,23)+"…":m.title)}</text></g>`).join("")}</svg></div>`; }
function previewPanel(cid){ const p = Object.assign({plan:"basic",aud:"adult",a11y:"default"}, (S.cprev||{})[cid]||{}), ac = ACADEMIES[cid], d = S.cdraft && S.cdraft[cid];

const DOC = Object.fromEntries(DOCS.map(d=>[d.id,d]));

const DOC_OLD = {}; DOCS.filter(d=>d.legacy && d.v==="0.2").forEach(d=>{ DOC_OLD[d.id] = {"0.1":{sum:"Initial placeholder: the document title and its purpose, without a section outline.",secs:[["Purpose",[["r",d.sum]]]],published:"Sep 25, 2026 (prototype)",superseded:"the revision with a full section outline"}}; });
function docByName(n){ return DOCS.find(d=>d.t===n || d.legacy===n || d.id===n) || null; }
function docTitle(n){ const d = docByName(n); return d ? d.t : n; }
function docVer(n){ const d = docByName(n); return d ? "v"+d.v : "v0.1"; }
/* keep one registry: LEGAL_DOCS now mirrors DOCS */
LEGAL_DOCS.length = 0; DOCS.forEach(d=>LEGAL_DOCS.push([d.t, "v"+d.v]));

/* ---------- consent records: ID, version, audience, context, actor, time, action, status, relation ---------- */
function consentCount(){ return Object.values(S.consents||{}).reduce((n,l)=>n+l.length,0); }
function audienceOf(id){ const a = ACCOUNTS[id]; if(!a) return "Adult"; return a.kind==="teen" ? "Teen" : a.kind==="guardian" ? "Guardian" : adminRoleOf(a)||a.kind==="owner" ? "Staff" : "Adult"; }
function relatedOf(id){ const a = ACCOUNTS[id]; if(!a) return "—"; if(a.kind==="guardian" && a.teen) return "Guardian link: "+a.name+" → "+ACCOUNTS[a.teen].name+(subOf(ACCOUNTS[a.teen])?" · "+subOf(ACCOUNTS[a.teen]).id:""); const s = subOf(a); if(a.kind==="teen") return "Guardian link: "+guardianName(a)+" → "+a.name+(s?" · "+s.id:""); return s ? s.id : "—"; }
function normConsent(id, c, i){ if(c.id) return c; const d = docByName(c.doc); return Object.assign(c, {id:"CR-"+id+"-"+(i+1), docAsPresented:c.doc, docId:d?d.id:c.doc, doc:d?d.t:c.doc, audience:audienceOf(id), context:c.how, action:c.how, actorId:id, kind:"accept", related:relatedOf(id)}); }
function addConsent(accId, doc, how, actor, x){ x = x||{}; const d = docByName(doc); S.consents[accId] = S.consents[accId]||[];
  const rec = {id:"CR-"+(consentCount()+101), docId:d?d.id:doc, doc:d?d.t:doc, v:d?"v"+d.v:"v0.1", audience:x.audience||audienceOf(accId), context:x.context||how, how, actor, actorId:x.actorId||accId,
    when:fd(TODAY)+" · "+nowStamp().split(" · ")[1], action:x.action||(x.kind==="withdraw"?"Chose Withdraw, then confirmed":"Checked an unchecked box, then confirmed"), kind:x.kind||"accept", related:x.related||relatedOf(accId)};
  S.consents[accId].push(rec); return rec; }
function consentStatus(accId, rec){
  if(rec.kind==="withdraw") return ["Withdrawal record","restr","⊗"];
  const list = S.consents[accId]||[], i = list.indexOf(rec);
  if(list.slice(i+1).some(r=>r.kind==="withdraw" && r.docId===rec.docId)) return ["Withdrawn","restr","⊗"];
  const t = (S.t18||{})[accId]; if(t && t.state==="done" && ["TEEN","MINORPRIV","TEENAUTH"].includes(rec.docId)) return ["Ended at 18 · kept in history","lock","⊠"];
  const d = DOC[rec.docId]; if(d && rec.v!=="v"+d.v) return ["Superseded by v"+d.v+" · accepted "+rec.v+" stays on record","lock","⊠"];
  if(list.slice(i+1).some(r=>r.kind!=="withdraw" && r.docId===rec.docId && r.v===rec.v)) return ["Renewed later","lock","⊠"];
  return ["Current","ok","✓"]; }
function consentTable(accId){ const list = (S.consents[accId]||[]).map((c,i)=>normConsent(accId,c,i));
  if(!list.length) return `<p class="small muted">No consent records.</p>`;
  return tbl(["Record","Document","Audience","Context","Actor","When","Action","Status","Related"], list.map(c=>{ const st = consentStatus(accId,c), d = DOC[c.docId];
    return [`<span class="mono small">${esc(c.id)}</span>`, d?`<button class="link" type="button" data-act="go" data-arg="legalDoc|${d.id}@${esc(c.v.slice(1))}">${esc(d.id)} · ${esc(d.t)} ${esc(c.v)}</button>`:esc(c.doc+" "+c.v), esc(c.audience), `<span class="small">${esc(c.context)}</span>`, esc(c.actor), `<span class="small num">${esc(c.when)}</span>`, `<span class="small">${esc(c.action)}</span>`, tag(st[1],st[2],st[0]), `<span class="small muted">${esc(c.related||"—")}</span>`]; }), "consents"); }
function legalVersions(docs){ return `<ul class="legalv">${docs.map(n=>{ const d = docByName(n); return `<li><span>${esc(d?d.t:n)}</span><span class="num small">${d?"v"+d.v:"v0.1"}</span></li>`; }).join("")}</ul>`; }
