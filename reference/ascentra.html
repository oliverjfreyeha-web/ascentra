<title>ASCENTRA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,600;1,6..96,500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* ===================== Design tokens ===================== */
:root{
  color-scheme:dark;
  --c-obsidian:#06070C; --c-midnight:#0B0F1F; --c-surface:#10152A; --c-surface-2:#151B35; --c-surface-3:#1C2344;
  --c-line:#2A3258; --c-line-soft:#1D2446;
  --c-text:#EFEBE1; --c-read:#DCD7CB; --c-muted:#A7ACC2; --c-faint:#8088A6;
  --c-brass:#C9A45C; --c-gold:#E7C983; --c-blue:#7A9FFF; --c-violet:#AE97FF; --c-aurora:#74E3CE;
  --c-ok:#82DBA8; --c-warn:#F3BC6C; --c-danger:#FF9494;
  --world-a:rgba(38,70,170,.50); --world-b:rgba(88,52,160,.38);
  --f-display:"Bodoni Moda","Bodoni 72",Didot,Georgia,serif;
  --f-read:"Newsreader",Georgia,"Times New Roman",serif;
  --f-ui:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --t-xs:12px; --t-sm:13.5px; --t-base:15px; --t-md:17px; --t-lg:21px; --t-xl:28px; --t-2xl:36px; --t-3xl:clamp(32px,4.6vw,52px); --t-hero:clamp(40px,7vw,84px);
  --s-1:4px; --s-2:8px; --s-3:12px; --s-4:16px; --s-5:24px; --s-6:32px; --s-7:48px; --s-8:64px; --s-9:96px;
  --r-sm:6px; --r-md:10px; --r-lg:16px; --r-pill:999px;
  --e-1:0 1px 0 rgba(255,255,255,.03) inset,0 10px 30px rgba(0,0,0,.30);
  --e-2:0 1px 0 rgba(255,255,255,.04) inset,0 24px 70px rgba(0,0,0,.60);
  --focus:0 0 0 2px var(--c-obsidian),0 0 0 4px var(--c-gold);
  --d-fast:120ms; --d-base:220ms; --d-slow:600ms; --d-cine:700ms;
  --ease-out:cubic-bezier(.2,.7,.2,1); --ease-cine:cubic-bezier(.65,0,.35,1);
  --glass:rgba(6,7,12,.74);
}
:root[data-motion="low"]{--d-base:120ms;--d-slow:200ms;--d-cine:250ms}
:root[data-motion="static"]{--d-fast:0ms;--d-base:0ms;--d-slow:0ms;--d-cine:0ms}
:root[data-transparency="reduced"]{--glass:#080A14}
:root[data-transparency="reduced"] .side,:root[data-transparency="reduced"] .top,:root[data-transparency="reduced"] .tabbar{backdrop-filter:none!important;background:#080A14!important}
@media (prefers-reduced-motion:reduce){:root{--d-slow:150ms;--d-cine:150ms}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--c-obsidian);color:var(--c-text);font:400 var(--t-base)/1.55 var(--f-ui);-webkit-font-smoothing:antialiased}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{box-shadow:var(--focus);border-radius:var(--r-sm)}
h1,h2,h3,h4{margin:0;text-wrap:balance}
p{margin:0}
ul,ol{margin:0;padding:0}
a{color:var(--c-gold)}
.ico{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ===================== Atmosphere ===================== */
.backdrop{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(1100px 620px at 82% -12%,var(--world-a),transparent 62%),radial-gradient(900px 560px at -8% 108%,var(--world-b),transparent 60%),linear-gradient(180deg,var(--c-midnight) 0%,var(--c-obsidian) 70%);
  transition:background var(--d-cine) var(--ease-cine)}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.8}
#app{position:relative;z-index:1;min-height:100%;zoom:var(--zoom,1)}

/* ===================== Prototype toolbar ===================== */
.protobar{background:repeating-linear-gradient(135deg,rgba(174,151,255,.07) 0 9px,transparent 9px 18px),#080A14;border-bottom:1px solid var(--c-line);font-size:var(--t-sm)}
.pb-sum{display:none;width:100%;align-items:center;gap:10px;background:transparent;border:0;padding:10px 16px;text-align:left}
.pb-sum .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--c-muted)}
.pb-body{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2) var(--s-4);padding:8px 16px}
.proto-tag{font:500 11px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c-violet);white-space:nowrap}
.protobar label{color:var(--c-muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.protobar select{background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:6px 8px;max-width:100%}
.protobar .spacer{flex:1}
@media (max-width:700px){
  .pb-sum{display:flex}
  .pb-body{display:none;padding-top:0}
  .protobar[data-open="true"] .pb-body{display:flex}
  .pb-body label{width:100%}
  .pb-body select{flex:1;min-width:0}
}

/* ===================== Frame ===================== */
.frame{display:grid;grid-template-columns:auto minmax(0,1fr)}
.frame.public{grid-template-columns:minmax(0,1fr)}
.frame.public .side{display:none}
.side{width:252px;position:sticky;top:0;height:100dvh;max-height:100vh;overflow-y:auto;display:flex;flex-direction:column;gap:var(--s-5);
  padding:var(--s-5) var(--s-3);border-right:1px solid var(--c-line-soft);background:rgba(6,7,12,.55);backdrop-filter:blur(8px);transition:width var(--d-base) var(--ease-out)}
.brand{display:grid;gap:6px;padding-inline:var(--s-2)}
.wordmark{font:600 20px/1 var(--f-display);letter-spacing:.34em;color:var(--c-gold)}
.tagline{font:italic 400 14px/1.3 var(--f-read);color:var(--c-muted)}
.ctx{justify-self:start;font:500 11px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-brass);border:1px solid rgba(201,164,92,.35);border-radius:var(--r-pill);padding:5px 9px;margin-top:6px}
.navgroup{display:grid;gap:2px}
.navlabel{font:500 10.5px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c-faint);padding:10px 12px 6px}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r-md);padding:10px 12px;color:var(--c-muted);font-weight:500;min-height:44px}
.navbtn:hover{color:var(--c-text);background:rgba(255,255,255,.03)}
.navbtn[aria-current="page"]{color:var(--c-text);background:var(--c-surface-2);border-color:var(--c-line)}
.navbtn[aria-current="page"] .ico{color:var(--c-gold)}
.navbtn.owner{color:var(--c-gold)}
.side-foot{margin-top:auto;display:grid;gap:var(--s-2)}
.collapse-btn{display:flex;align-items:center;gap:10px;background:transparent;border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:8px 12px;color:var(--c-muted);font-size:var(--t-sm);min-height:40px}
.collapse-btn .ico{transition:transform var(--d-base)}
.side.collapsed{width:92px}
.side.collapsed .tagline,.side.collapsed .ctx,.side.collapsed .navlabel{display:none}
.side.collapsed .wordmark{font-size:13px;letter-spacing:.2em;text-align:center}
.side.collapsed .navbtn{flex-direction:column;gap:4px;padding:10px 4px;font-size:11px;text-align:center;line-height:1.2}
.side.collapsed .collapse-btn{justify-content:center;font-size:11px;flex-direction:column;gap:2px}
.side.collapsed .collapse-btn .ico{transform:rotate(180deg)}
/* tablet: always compact rail, labels kept */
@media (min-width:901px) and (max-width:1180px){
  .side{width:92px}
  .side .tagline,.side .ctx,.side .navlabel,.side .collapse-btn{display:none}
  .side .wordmark{font-size:13px;letter-spacing:.2em;text-align:center}
  .side .navbtn{flex-direction:column;gap:4px;padding:10px 4px;font-size:11px;text-align:center;line-height:1.2}
  .side .navbtn .full{display:none} .side .navbtn .short{display:inline!important}
}
.navbtn .short{display:none}

.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:var(--s-3);padding:10px 24px;
  background:var(--glass);backdrop-filter:blur(12px);border-bottom:1px solid var(--c-line-soft);min-height:60px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0;color:var(--c-muted);font-size:var(--t-sm);flex-wrap:nowrap;overflow:hidden}
.crumb button{background:none;border:0;padding:4px 2px;color:var(--c-muted);white-space:nowrap}
.crumb button:hover{color:var(--c-text);text-decoration:underline}
.crumb b{color:var(--c-text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .m-word{display:none;font:600 14px/1 var(--f-display);letter-spacing:.28em;color:var(--c-gold)}
.top .grow{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--c-line);background:var(--c-surface);border-radius:var(--r-pill);padding:6px 11px;font-size:var(--t-xs);font-weight:600;white-space:nowrap;min-height:34px}
.chip.gold{color:var(--c-gold);border-color:rgba(231,201,131,.35)}
.chip.proto{color:var(--c-violet);border-color:rgba(174,151,255,.4)}
.chip.off{color:var(--c-warn);border-color:rgba(243,188,108,.45)}
.iconbtn{position:relative;display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);background:var(--c-surface);color:var(--c-muted)}
.iconbtn:hover{color:var(--c-text)}
.dot{position:absolute;top:7px;right:7px;min-width:8px;height:8px;border-radius:4px;background:var(--c-gold)}
.avatar{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f-display);background:linear-gradient(160deg,#2B3366,#171C38);border:1px solid rgba(231,201,131,.4);color:var(--c-gold)}

main{outline:none}
main:focus,main:focus-visible{box-shadow:none}
.content{max-width:1180px;margin:0 auto;padding-inline:32px;padding-block:28px 72px;display:grid;gap:var(--s-6)}
.content.wide{max-width:1280px}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));
  background:rgba(8,10,20,.94);backdrop-filter:blur(12px);border-top:1px solid var(--c-line);justify-content:space-around;gap:2px}
.tab{flex:1;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:transparent;color:var(--c-muted);font-size:11px;font-weight:600;border-radius:var(--r-md);min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--c-gold);background:rgba(231,201,131,.06)}

@media (max-width:900px){
  .side{display:none}
  .frame{grid-template-columns:minmax(0,1fr)}
  .frame:not(.public) ~ .tabbar,.tabbar.on{display:flex}
  .content{padding-inline:16px;padding-bottom:120px}
  .top{padding:10px 16px}
  .crumb .m-word{display:inline}
  .crumb .ctxpart{display:none}
  .crumb b{display:none}
  .hide-m{display:none!important}
}

/* ===================== Typography ===================== */
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c-brass)}
.display{font-family:var(--f-display);font-weight:500;letter-spacing:-.005em;line-height:1.08}
h1.display{font-size:var(--t-3xl)}
h2.display{font-size:var(--t-xl)}
h3{font:600 var(--t-md)/1.3 var(--f-ui)}
.read{font:400 17px/1.6 var(--f-read);color:var(--c-read);max-width:64ch}
.muted{color:var(--c-muted)}
.small{font-size:var(--t-sm)}
.mono{font-family:var(--f-mono);font-size:.88em}
.num{font-variant-numeric:tabular-nums}

/* ===================== Surfaces ===================== */
.panel{background:rgba(16,21,42,.88);border:1px solid var(--c-line-soft);border-radius:var(--r-lg);padding:var(--s-5);display:grid;gap:var(--s-4);align-content:start;box-shadow:var(--e-1);min-width:0}
.panel.flat{box-shadow:none;background:rgba(16,21,42,.6)}
.feature{position:relative;background:linear-gradient(165deg,rgba(28,35,68,.95),rgba(14,18,38,.95));border:1px solid rgba(231,201,131,.22);border-radius:var(--r-lg);padding:var(--s-6);display:grid;gap:var(--s-4);box-shadow:var(--e-2);overflow:hidden;min-width:0}
.feature::before{content:"";position:absolute;inset:0 0 auto 0;height:1px;background:linear-gradient(90deg,transparent,var(--c-gold),transparent);opacity:.6}
@media (max-width:600px){.feature{padding:var(--s-5)}.panel{padding:var(--s-4)}}
.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--s-3);flex-wrap:wrap}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s-2)}
.stack{display:grid;gap:var(--s-3);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-5)}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s-4)}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s-4)}
.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:var(--s-5);align-items:start}
@media (max-width:1000px){.grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.grid2,.grid3,.grid4,.split{grid-template-columns:1fr}}
.hr{height:1px;background:var(--c-line-soft);border:0;margin:0}

/* ===================== Buttons & forms ===================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:var(--r-md);border:1px solid var(--c-line);background:var(--c-surface-2);font-weight:600;font-size:14px;transition:border-color var(--d-fast),background var(--d-fast);text-decoration:none;color:var(--c-text)}
.btn:hover:not(:disabled){border-color:var(--c-muted)}
.btn.primary{background:linear-gradient(180deg,#EDD493,#C9A45C);border-color:#C9A45C;color:#1B1506}
.btn.primary:hover:not(:disabled){filter:brightness(1.05)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px}
.btn.big{min-height:52px;padding:14px 24px;font-size:15px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.link{background:none;border:0;padding:2px 0;color:var(--c-gold);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(231,201,131,.4);text-align:left}
.field{display:grid;gap:6px}
.field label{font-weight:600;font-size:var(--t-sm)}
.field .hint{font-size:var(--t-xs);color:var(--c-muted)}
.field .err{font-size:var(--t-sm);color:var(--c-danger)}
input[type=text],input[type=email],input[type=password],select.input,textarea{width:100%;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-md);padding:12px;min-height:46px}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--c-danger)}
textarea{min-height:84px;resize:vertical;font:400 16px/1.5 var(--f-read)}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--c-gold);flex:none}

/* ===================== Status ===================== */
.st{display:inline-flex;align-items:center;gap:6px;font:500 11.5px/1 var(--f-mono);letter-spacing:.02em;padding:4px 8px;border-radius:var(--r-pill);border:1px solid;white-space:nowrap;justify-self:start;align-self:center;width:max-content;max-width:100%}
.st-proto{color:#A9C0FF;border-color:rgba(122,159,255,.45);background:rgba(122,159,255,.10)}
.st-sim{color:#CDBFFF;border-color:rgba(174,151,255,.45);background:rgba(174,151,255,.10)}
.st-disc{color:var(--c-muted);border:1px dashed #525A82;background:transparent}
.st-ok{color:var(--c-ok);border-color:rgba(130,219,168,.45);background:rgba(130,219,168,.08)}
.st-warn{color:var(--c-warn);border-color:rgba(243,188,108,.5);background:rgba(243,188,108,.08)}
.st-lock{color:var(--c-faint);border-color:#363E63;background:rgba(255,255,255,.02)}
.st-restr{color:var(--c-danger);border-color:rgba(255,148,148,.45);background:rgba(255,148,148,.07)}
.st-prog{color:var(--c-blue);border-color:rgba(122,159,255,.35);background:transparent}
.st-avail{color:var(--c-text);border-color:#444C7A;background:transparent}
.st-doc{color:var(--c-gold);border-color:rgba(231,201,131,.4);background:rgba(231,201,131,.07)}
.st-concept{color:#D8CFB7;border:1px dotted #7A725B;background:transparent}

/* ===================== Notices ===================== */
.notice{display:flex;gap:var(--s-3);align-items:flex-start;border-radius:var(--r-md);padding:12px 16px;border:1px solid var(--c-line);background:rgba(16,21,42,.85);font-size:var(--t-sm)}
.notice .ico{margin-top:1px}
.notice.warn{border-color:rgba(243,188,108,.35)} .notice.warn>.ico{color:var(--c-warn)}
.notice.sim{border-color:rgba(174,151,255,.35)} .notice.sim>.ico{color:var(--c-violet)}
.notice.gold{border-color:rgba(231,201,131,.35)} .notice.gold>.ico{color:var(--c-gold)}
.notice.err{border-color:rgba(255,148,148,.4)} .notice.err>.ico{color:var(--c-danger)}
.notice.ok{border-color:rgba(130,219,168,.4)} .notice.ok>.ico{color:var(--c-ok)}
.notice .body{display:grid;gap:6px;flex:1;min-width:0}

/* ===================== Today ===================== */
.hero{display:grid;gap:var(--s-3);padding-top:var(--s-2)}
.enter{animation:rise var(--d-cine) var(--ease-out) both}
@keyframes rise{from{opacity:.7;transform:translateY(8px)}to{opacity:1;transform:none}}
:root[data-motion="static"] .enter,:root[data-motion="low"] .enter{animation:none}
@media (prefers-reduced-motion:reduce){.enter{animation:none}}
.mission h2{font:500 clamp(24px,3vw,32px)/1.15 var(--f-display)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;color:var(--c-muted);font-size:var(--t-sm)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:grid;gap:6px;justify-items:center;font:500 11px var(--f-mono);color:var(--c-faint)}
.pip{width:100%;height:28px;border-radius:6px;border:1px solid var(--c-line);display:grid;place-items:center;font-size:12px}
.pip.done{background:rgba(130,219,168,.14);border-color:rgba(130,219,168,.45);color:var(--c-ok)}
.pip.miss{border-style:dashed;color:var(--c-warn);border-color:rgba(243,188,108,.45)}
.pip.plan{color:var(--c-muted)}
.pip.today{outline:1px solid var(--c-gold);outline-offset:2px}
.pip.rec{background:rgba(122,159,255,.14);border-color:rgba(122,159,255,.45);color:var(--c-blue)}
.stagetrack{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.stg{display:grid;gap:6px}
.stg .bar{height:4px;border-radius:2px;background:var(--c-surface-3)}
.stg.done .bar{background:var(--c-ok)} .stg.cur .bar{background:linear-gradient(90deg,var(--c-gold) var(--p,40%),var(--c-surface-3) var(--p,40%))}
.stg span{font-size:11px;color:var(--c-muted)}
.stg.cur span{color:var(--c-text);font-weight:600}
.bignum{font:500 34px/1 var(--f-display)}

/* ===================== Academy ===================== */
.modlist{display:grid;gap:6px}
.mod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:var(--s-3);align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);background:rgba(16,21,42,.7);min-height:56px}
.mod:hover{border-color:var(--c-line)}
.mod[aria-pressed="true"]{border-color:rgba(231,201,131,.5);background:rgba(28,35,68,.9)}
.mod .n{font:500 22px/1 var(--f-display);color:var(--c-faint);font-variant-numeric:tabular-nums}
.mod.is-complete .n{color:var(--c-ok)} .mod.is-inProgress .n{color:var(--c-gold)}
.mod .t{display:grid;gap:4px;min-width:0}
.mod .t b{font-weight:600}
.mod .t small{color:var(--c-muted);font-size:var(--t-xs)}
.mod .badges{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:600px){.mod{grid-template-columns:34px minmax(0,1fr)} .mod .badges{grid-column:2;justify-content:flex-start}}
.groupname{display:flex;align-items:baseline;gap:10px;margin-top:10px;flex-wrap:wrap}
.groupname h3{font:500 18px var(--f-display)}
.acts{display:grid;gap:4px}
.act{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r-sm);background:rgba(255,255,255,.02);border:1px solid transparent;text-align:left;width:100%;min-height:48px}
.act:hover{border-color:var(--c-line)}
.act small{display:block;color:var(--c-muted);font-size:var(--t-xs)}
.detail-sticky{position:sticky;top:80px}
@media (max-width:760px){.detail-sticky{position:static}}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:1px solid var(--c-line-soft)}
.tabs button{background:transparent;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:var(--c-muted);font-weight:600;margin-bottom:-1px;min-height:44px}
.tabs button[aria-selected="true"]{color:var(--c-text);border-bottom-color:var(--c-gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tagchip{font-size:12.5px;padding:5px 10px;border-radius:var(--r-pill);border:1px solid var(--c-line);color:var(--c-read)}
.backrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.backbtn{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid var(--c-line-soft);border-radius:var(--r-pill);padding:6px 12px 6px 8px;color:var(--c-muted);font-weight:600;font-size:var(--t-sm);min-height:36px}
.backbtn:hover{color:var(--c-text)}
.pcrumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:var(--t-sm);color:var(--c-faint)}
.pcrumb button{background:none;border:0;padding:2px;color:var(--c-muted)}
.pcrumb button:hover{color:var(--c-text);text-decoration:underline}
.pcrumb b{color:var(--c-text);font-weight:600}

/* ===================== Maps ===================== */
.mapbox{border:1px solid var(--c-line-soft);border-radius:var(--r-lg);background:radial-gradient(100% 120% at 50% 0%,rgba(38,70,170,.14),transparent 70%),rgba(8,10,22,.85);padding:var(--s-3)}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox text{font-family:var(--f-ui);fill:var(--c-read)}
.mapnode{cursor:pointer}
.mapnode:focus-visible{outline:none}
.mapnode:focus-visible circle.ring{stroke:var(--c-gold);stroke-width:3}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:var(--t-xs);color:var(--c-muted)}

/* ===================== Lesson ===================== */
.lesson{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:var(--s-5);align-items:start}
@media (max-width:1000px){.lesson{grid-template-columns:1fr}}
.prose{display:grid;gap:var(--s-4)}
.prose p{font:400 18px/1.7 var(--f-read);color:var(--c-read);max-width:66ch}
.para{display:grid;gap:6px}
.para.hl p{background:linear-gradient(transparent 60%,rgba(231,201,131,.18) 60%)}
.media{border:1px dashed var(--c-line);border-radius:var(--r-md);padding:var(--s-4);display:grid;gap:10px;background:rgba(0,0,0,.25)}
.media .screen{aspect-ratio:16/9;max-width:100%;border-radius:var(--r-sm);display:grid;place-items:center;background:linear-gradient(160deg,#141A36,#0A0D1C);color:var(--c-muted);text-align:center;padding:16px}
.transcript{font:400 15px/1.6 var(--f-read);color:var(--c-read);max-height:180px;overflow:auto;padding-right:8px}
.q{display:grid;gap:10px;border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:var(--s-4)}
.opt{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--c-line);background:rgba(255,255,255,.02);min-height:48px}
.opt:hover:not(:disabled){border-color:var(--c-muted)}
.opt.right{border-color:rgba(130,219,168,.6);background:rgba(130,219,168,.08)}
.opt.wrong{border-color:rgba(255,148,148,.55);background:rgba(255,148,148,.06)}
.opt:disabled{cursor:default}
.card3d{border:1px solid rgba(231,201,131,.35);border-radius:var(--r-lg);padding:var(--s-6);min-height:190px;display:grid;place-items:center;text-align:center;background:linear-gradient(165deg,rgba(28,35,68,.95),rgba(14,18,38,.95))}
.card3d p{font:500 24px/1.3 var(--f-display);max-width:28ch}

/* ===================== Mentor ===================== */
.mentor{display:grid;grid-template-columns:260px minmax(0,1fr);gap:var(--s-4);align-items:start}
@media (max-width:760px){.mentor{grid-template-columns:1fr}}
.threads{display:grid;gap:4px}
.thread{text-align:left;padding:12px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);background:rgba(16,21,42,.6);min-height:48px}
.thread[aria-pressed="true"]{border-color:rgba(231,201,131,.45)}
.convo{display:grid;gap:var(--s-3)}
.msg{max-width:82%;padding:12px 14px;border-radius:14px;font:400 16px/1.55 var(--f-read);display:grid;gap:8px}
.msg.me{justify-self:end;background:var(--c-surface-3);border:1px solid var(--c-line)}
.msg.demo{justify-self:start;background:rgba(122,159,255,.07);border:1px solid rgba(122,159,255,.25)}
.msg.sys{justify-self:stretch;max-width:none;font:500 13.5px/1.5 var(--f-ui);color:var(--c-muted);background:transparent;border:1px dashed var(--c-line);border-radius:var(--r-md);display:flex;gap:8px;align-items:flex-start}
.msg .who{display:block;font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--c-faint)}
@media (max-width:600px){.msg{max-width:100%}}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--c-muted);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
:root[data-motion="static"] .typing i{animation:none}
.srcref{display:inline-flex;gap:6px;align-items:center;font:500 12px var(--f-mono);color:var(--c-gold);border:1px solid rgba(231,201,131,.3);border-radius:4px;padding:2px 6px}

/* ===================== Conflict ===================== */
.claims{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s-3)}
@media (max-width:700px){.claims{grid-template-columns:1fr}}
.claim{border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--s-4);display:grid;gap:10px;background:rgba(255,255,255,.015);min-width:0}
.claim.rec{border-color:rgba(231,201,131,.4)}
.claim q{font:400 17px/1.5 var(--f-read);color:var(--c-read);quotes:none}
.ind{display:flex;flex-wrap:wrap;gap:6px}
.ind span{font:500 11px var(--f-mono);color:var(--c-muted);border:1px solid var(--c-line-soft);border-radius:4px;padding:3px 6px}
.list{display:grid;gap:8px;padding-left:18px}
.list li{color:var(--c-read)}

/* ===================== Meters ===================== */
.meters{display:grid;gap:12px}
.meter{display:grid;grid-template-columns:130px minmax(0,1fr) 44px;gap:12px;align-items:center;font-size:var(--t-sm)}
.meter .track{height:8px;border-radius:4px;background:var(--c-surface-3);overflow:hidden}
.meter .fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--c-blue),var(--c-violet));transition:width var(--d-slow) var(--ease-out)}
.meter.comp .fill{background:var(--c-muted)}
.meter b{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
@media (max-width:480px){.meter{grid-template-columns:100px minmax(0,1fr) 40px}}

/* ===================== Worlds ===================== */
.worlds{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:var(--s-3)}
.world{position:relative;text-align:left;padding:0;border-radius:var(--r-lg);border:1px solid var(--c-line);background:var(--c-surface);overflow:hidden;display:grid}
.world .sw{height:92px;background:var(--sw)}
.world .wt{padding:12px 14px;display:grid;gap:4px}
.world .wt b{font:500 17px var(--f-display)}
.world .wt small{color:var(--c-muted);font-size:var(--t-xs)}
.world[aria-pressed="true"]{border-color:var(--c-gold);box-shadow:0 0 0 1px var(--c-gold)}
.world .on{position:absolute;top:10px;right:10px}
.radios{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.radio{display:grid;gap:4px;padding:12px;border-radius:var(--r-md);border:1px solid var(--c-line);cursor:pointer}
.radio:has(input:checked){border-color:var(--c-gold);background:rgba(231,201,131,.05)}
.radio input{accent-color:var(--c-gold);margin:0;width:18px;height:18px}
.radio small{color:var(--c-muted);font-size:var(--t-xs)}
.slider{display:grid;grid-template-columns:110px minmax(0,1fr) 40px;gap:12px;align-items:center;font-size:var(--t-sm)}
.slider input{accent-color:var(--c-gold);width:100%}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;min-height:40px}
.switch input{width:20px;height:20px;accent-color:var(--c-gold)}

/* ===================== Tables (stack into cards on phones) ===================== */
.tablewrap{border:1px solid var(--c-line-soft);border-radius:var(--r-md);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--c-line-soft);vertical-align:middle}
th{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c-faint);background:rgba(255,255,255,.015)}
tr:last-child td{border-bottom:0}
td select{background:var(--c-surface-2);border:1px solid var(--c-line);border-radius:var(--r-sm);padding:8px;min-height:40px;max-width:100%}
@media (max-width:760px){
  table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
  table.rt thead{display:none}
  table.rt tr{padding:10px 0;border-bottom:1px solid var(--c-line-soft)}
  table.rt tr:last-child{border-bottom:0}
  table.rt td{border:0;padding:5px 14px;display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr);gap:10px;align-items:start}
  table.rt td::before{content:attr(data-label);font:500 10.5px/1.6 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--c-faint)}
  table.rt td[data-label=""]{grid-template-columns:1fr}
  table.rt td[data-label=""]::before{display:none}
}
.matrix td:not(:first-child),.matrix th:not(:first-child){text-align:center}
.only-m{display:none}
@media (max-width:760px){.only-d{display:none!important}.only-m{display:grid}}

/* ===================== Admin shell ===================== */
.admin{display:grid;grid-template-columns:230px minmax(0,1fr);gap:var(--s-5);align-items:start}
.admin-nav{display:grid;gap:2px;position:sticky;top:80px}
.admin-nav button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:transparent;border:1px solid transparent;border-radius:var(--r-sm);padding:9px 12px;color:var(--c-muted);font-weight:500;font-size:var(--t-sm);min-height:40px}
.admin-nav button:hover{color:var(--c-text)}
.admin-nav button[aria-current="page"]{color:var(--c-text);background:var(--c-surface-2);border-color:var(--c-line)}
.admin-sel{display:none}
@media (max-width:900px){.admin{grid-template-columns:1fr}.admin-nav{display:none}.admin-sel{display:grid}}

/* ===================== Protect / weeks ===================== */
.protect{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border-radius:var(--r-md);border:1px solid rgba(231,201,131,.45);background:linear-gradient(90deg,rgba(231,201,131,.10),rgba(231,201,131,.02))}
.protect .ico{color:var(--c-gold);width:24px;height:24px}
.protect p{font:400 16px/1.5 var(--f-read);color:var(--c-text)}
.weeks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:900px){.weeks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:480px){.weeks{grid-template-columns:1fr}}
.wk{border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:12px;display:grid;gap:8px;align-content:start;background:rgba(255,255,255,.015)}
.wk h4{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--c-brass)}
.wk .m{display:grid;gap:4px;font-size:var(--t-sm)}
.wk .m b{font-weight:600;line-height:1.3}

/* ===================== Empty / restricted / skeleton ===================== */
.empty{display:grid;justify-items:start;gap:var(--s-3);padding:var(--s-6);border:1px dashed var(--c-line);border-radius:var(--r-lg);background:rgba(16,21,42,.5)}
.empty h3{font:500 22px var(--f-display)}
.restricted{border-color:rgba(255,148,148,.3)}
.skel{border-radius:var(--r-md);background:linear-gradient(90deg,rgba(255,255,255,.03),rgba(255,255,255,.07),rgba(255,255,255,.03));background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
:root[data-motion="static"] .skel{animation:none}
.offbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-radius:var(--r-md);border:1px dashed rgba(243,188,108,.5);background:rgba(243,188,108,.06);font-size:var(--t-sm)}

/* ===================== Public site ===================== */
.pub-top{display:flex;align-items:center;gap:var(--s-4);width:100%}
.pub-links{display:flex;gap:2px;flex-wrap:nowrap}
.pub-links button{background:transparent;border:0;padding:8px 12px;color:var(--c-muted);font-weight:500;border-radius:var(--r-sm);white-space:nowrap;min-height:40px}
.pub-links button:hover,.pub-links button[aria-current="page"]{color:var(--c-text)}
.pub-links button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--c-gold)}
.pub-word{font:600 17px/1 var(--f-display);letter-spacing:.32em;color:var(--c-gold);background:none;border:0;padding:6px 0}
@media (max-width:1060px){.pub-links{display:none}}
.pub-menu{display:none}
@media (max-width:1060px){.pub-menu{display:grid}}
.pubhero{display:grid;gap:var(--s-5);padding-block:var(--s-8) var(--s-6);max-width:880px}
.pubhero h1{font:500 var(--t-hero)/1.0 var(--f-display);letter-spacing:-.01em}
.pubhero h1 em{font-style:italic;color:var(--c-gold)}
.pubhero .lede{font:400 clamp(18px,2vw,22px)/1.55 var(--f-read);color:var(--c-read);max-width:56ch}
.path{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;counter-reset:s;border-top:1px solid var(--c-line)}
.path li{list-style:none;padding:var(--s-4) var(--s-3) var(--s-4) 0;display:grid;gap:6px;border-right:1px solid var(--c-line-soft);padding-left:var(--s-3)}
.path li:last-child{border-right:0}
.path li b{font:500 19px var(--f-display)}
.path li span{font-size:var(--t-sm);color:var(--c-muted)}
.path li i{font:500 11px var(--f-mono);font-style:normal;color:var(--c-brass);letter-spacing:.12em}
@media (max-width:900px){.path{grid-template-columns:1fr 1fr}.path li{border-right:0;border-bottom:1px solid var(--c-line-soft)}}
@media (max-width:480px){.path{grid-template-columns:1fr}}
.section-h{display:grid;gap:8px;max-width:720px}
.section-h h2{font:500 clamp(26px,3.4vw,40px)/1.1 var(--f-display)}
.footer{border-top:1px solid var(--c-line-soft);padding-top:var(--s-5);display:flex;flex-wrap:wrap;gap:var(--s-4);justify-content:space-between;color:var(--c-muted);font-size:var(--t-sm)}
.footer .links{display:flex;flex-wrap:wrap;gap:4px 14px}
.footer button{background:none;border:0;color:var(--c-muted);padding:4px 0}
.footer button:hover{color:var(--c-text)}
.steps{display:grid;gap:10px;counter-reset:st}
.stepcard{display:grid;grid-template-columns:56px minmax(0,1fr);gap:var(--s-4);padding:var(--s-5);border:1px solid var(--c-line-soft);border-radius:var(--r-lg);background:rgba(16,21,42,.7)}
.stepcard .no{font:500 34px/1 var(--f-display);color:var(--c-gold)}
.formcard{max-width:560px;width:100%;display:grid;gap:var(--s-4)}
.agebtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}

/* ===================== Layer ===================== */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,4,8,.66);display:grid;place-items:center;padding:16px;animation:fade var(--d-base) both}
@keyframes fade{from{opacity:0}}
.dialog{width:min(720px,100%);max-height:calc(100dvh - 32px);overflow:auto;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--e-2);padding:var(--s-6);display:grid;gap:var(--s-4)}
@media (max-width:600px){.dialog{padding:var(--s-5)}}
.dialog h2{font:500 26px/1.15 var(--f-display)}
.dlg-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pop{position:fixed;z-index:40;width:min(360px,calc(100vw - 32px));max-height:min(560px,calc(100dvh - 90px));overflow:auto;background:var(--c-surface);border:1px solid var(--c-line);border-radius:var(--r-lg);box-shadow:var(--e-2);padding:var(--s-4);display:grid;gap:var(--s-3);animation:fade var(--d-fast) both}
.pop h3{font:600 15px var(--f-ui)}
@media (max-width:720px){.pop{left:0!important;right:0!important;top:auto!important;bottom:0;width:auto;border-radius:18px 18px 0 0;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));max-height:80dvh}}
.popscrim{position:fixed;inset:0;z-index:39;background:transparent}
@media (max-width:720px){.popscrim{background:rgba(3,4,8,.5)}}
.menu{display:grid;gap:2px}
.menu button{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-radius:var(--r-sm);padding:10px;color:var(--c-text);min-height:44px}
.menu button:hover{background:var(--c-surface-2)}
.note{display:grid;gap:3px;padding:10px 12px;border-radius:var(--r-sm);background:rgba(255,255,255,.02);border:1px solid var(--c-line-soft);font-size:var(--t-sm)}
.note.unread{border-color:rgba(231,201,131,.35)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:var(--t-sm);margin:0}
.kv dt{color:var(--c-muted)} .kv dd{margin:0;font-weight:500;min-width:0}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:760px){.plans{grid-template-columns:1fr}}
.plan{border:1px solid var(--c-line);border-radius:var(--r-md);padding:var(--s-4);display:grid;gap:10px;align-content:start;background:rgba(16,21,42,.7)}
.plan.cur,.plan.pick{border-color:var(--c-gold)}
.plan .price{font:500 32px var(--f-display)}
.plan .price small{font:500 14px var(--f-ui);color:var(--c-muted)}
.plan ul{padding-left:16px;display:grid;gap:4px;font-size:var(--t-sm);color:var(--c-read)}

#toasts{position:fixed;z-index:60;left:50%;transform:translateX(-50%);bottom:24px;display:grid;gap:8px;width:min(520px,calc(100vw - 32px));pointer-events:none}
@media (max-width:900px){#toasts{bottom:calc(88px + env(safe-area-inset-bottom,0px))}}
.toast{pointer-events:auto;display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r-md);background:#1A2043;border:1px solid var(--c-line);box-shadow:var(--e-2);font-size:var(--t-sm);animation:fade var(--d-base) both}
.toast .ico{color:var(--c-gold)}
/* ===================== Stage 3: learning engine ===================== */
.progressbar{height:6px;border-radius:3px;background:var(--c-surface-3);overflow:hidden}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,var(--c-brass),var(--c-gold));transition:width var(--d-slow) var(--ease-out)}
.progressbar.warn i{background:linear-gradient(90deg,var(--c-warn),#E88B5C)}
.ivwrap{max-width:780px;display:grid;gap:var(--s-5)}
.ivq{font:500 clamp(24px,3.2vw,36px)/1.15 var(--f-display)}
.ivnav{border-top:1px solid var(--c-line-soft);padding-top:var(--s-4)}
.ivnav .grow{flex:1}
.ivrev{display:grid;margin:0;border:1px solid var(--c-line-soft);border-radius:var(--r-md)}
.ivrev>div{display:grid;grid-template-columns:170px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--c-line-soft)}
.ivrev>div:last-child{border-bottom:0}
.ivrev dt{color:var(--c-muted);font-size:var(--t-sm)} .ivrev dd{margin:0;min-width:0;overflow-wrap:anywhere}
@media (max-width:600px){.ivrev>div{grid-template-columns:minmax(0,1fr) auto}.ivrev dt{grid-column:1/-1}}
.choices{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.choices.one{grid-template-columns:1fr}

.bs.done .bi{color:var(--c-ok);border-color:rgba(130,219,168,.5);background:rgba(130,219,168,.08)}
.bs.run{border-color:rgba(231,201,131,.45)} .bs.run .bi{color:var(--c-gold);border-color:var(--c-gold);animation:pulse 1.2s ease-in-out infinite}

.bs.wait{opacity:.72}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(231,201,131,.12)}}
:root[data-motion="static"] .bs.run .bi,:root[data-motion="low"] .bs.run .bi{animation:none}
.reveal{animation:rise calc(var(--d-cine) * 1.4) var(--ease-out) both;animation-delay:var(--delay,0ms)}

.plan-list small{display:block;color:var(--c-muted);font-size:var(--t-xs)}
.weeks2{display:grid;gap:10px}
.weekrow{display:grid;gap:6px}
.wklabel{font:500 10.5px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-faint)}
.pip.heavy{background:rgba(243,188,108,.14);border-color:rgba(243,188,108,.5);color:var(--c-warn)}

.pip.paused{color:var(--c-violet);border-color:rgba(174,151,255,.45)}
.bars{display:flex;gap:6px;align-items:flex-end;height:64px}

.meter .track{position:relative;overflow:visible}

.ex.ok{border-color:rgba(130,219,168,.28)} .ex.ok .eyebrow{color:var(--c-ok)}
.ex.bad{border-color:rgba(243,188,108,.28)} .ex.bad .eyebrow{color:var(--c-warn)}
.q.variant{border-style:dashed;border-color:rgba(122,159,255,.45);background:rgba(122,159,255,.04);margin-top:4px}
.ob{width:20px;display:inline-block;text-align:center;color:var(--c-faint)}
.conf{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn-sub{display:block;font-weight:500;font-size:11px;opacity:.75}
.focusbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:10px 16px;border:1px solid var(--c-line);border-radius:var(--r-md);background:#0B0F1F}
#app.focus .side,#app.focus .top,#app.focus .protobar,#app.focus .tabbar{display:none!important}
#app.focus .frame{grid-template-columns:minmax(0,1fr)}
#app.focus .content{max-width:820px;padding-bottom:72px}
:root[data-focus="1"] .backdrop{opacity:.35}
:root[data-focus="1"] #sky{opacity:.25}
.lesson.focus-one{grid-template-columns:1fr}

.calc{display:grid;gap:8px}

@media (max-width:600px){.calcrow{grid-template-columns:1fr 1fr;padding-bottom:10px;border-bottom:1px solid var(--c-line-soft)}.calcrow .field:first-of-type{grid-column:1/-1}}
.touch{border:1px solid var(--c-line-soft);border-radius:var(--r-md);padding:12px;display:grid;gap:8px;margin:0;min-width:0}
.touch legend{font-weight:600;font-size:var(--t-sm);padding:0 6px}
.rvrow{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:16px;align-items:start;padding:12px 0;border-bottom:1px solid var(--c-line-soft)}
@media (max-width:700px){.rvrow{grid-template-columns:1fr}}
.cert{position:relative;border:1px solid rgba(231,201,131,.55);border-radius:var(--r-lg);padding:var(--s-7) var(--s-6);display:grid;gap:var(--s-3);justify-items:center;text-align:center;background:radial-gradient(80% 120% at 50% 0%,rgba(231,201,131,.12),transparent 70%),linear-gradient(165deg,rgba(28,35,68,.95),rgba(14,18,38,.95))}

.cert{grid-template-columns:minmax(0,1fr)}
.cert>*{max-width:100%;min-width:0}
@media (max-width:600px){.cert{padding:var(--s-6) var(--s-4)}}
.cert::before{content:"";position:absolute;inset:8px;border:1px solid rgba(231,201,131,.2);border-radius:12px;pointer-events:none}
.claim.gov{border-color:rgba(130,219,168,.5)}
.msg.bot{justify-self:start;background:rgba(122,159,255,.07);border:1px solid rgba(122,159,255,.25)}
details>summary{cursor:pointer}
.content>*,.stack>*,.split>*,details.panel>*{min-width:0}
details.panel{min-width:0}
.st{white-space:normal;text-align:left;line-height:1.3}

@media (min-width:701px){.protobar select{max-width:230px}.pb-body{gap:6px 14px}.protobar .btn.small{min-height:32px;padding:4px 10px}}
/* ===================== Stage 4: refined system, Worlds, sequences ===================== */
:root{--c-ivory:#F3EEE2;--c-stone:#B9B2A3;--c-cyan:#6FD6F2;--surf-shell:rgba(6,7,12,.74);--surf-panel:rgba(16,21,42,.9);--surf-read:#0D1124;--surf-overlay:#10152A}
/* sentence-case labels instead of tiny uppercase everywhere */
.eyebrow{font:600 12.5px/1.35 var(--f-ui);letter-spacing:.015em;text-transform:none;color:var(--c-brass)}
.navlabel{font:600 11.5px/1 var(--f-ui);letter-spacing:.02em;text-transform:none}
th{font:600 12px/1.3 var(--f-ui);letter-spacing:.01em;text-transform:none}
.wklabel,.wk h4{font:600 12px/1.2 var(--f-ui);letter-spacing:.01em;text-transform:none}
@media (max-width:760px){table.rt td::before{font:600 11.5px/1.5 var(--f-ui);letter-spacing:.01em;text-transform:none}}
.num,.bignum,.meter b,.mono{font-variant-numeric:tabular-nums lining-nums}
.panel{background:var(--surf-panel)}
.reading,.doc{background:var(--surf-read);border-color:#232A4C;box-shadow:none}
.reading .prose p,.doc .docsec p{color:#E8E2D4}
/* environment calm and contrast */
#sky{transition:opacity var(--d-slow) var(--ease-out)} .backdrop{transition:opacity var(--d-slow) var(--ease-out)}
:root[data-calm="1"] #sky{opacity:.32} :root[data-calm="1"] .backdrop{opacity:.75}
:root[data-render="fallback"] #sky{display:none}
:root[data-contrast="high"]{--c-muted:#CDD1E0;--c-faint:#AEB4CC;--c-line:#4A5490;--c-line-soft:#3A427C;--c-read:#F1ECE0;--glass:#070910;--surf-panel:#0F1430;--surf-read:#0B0F22}
:root[data-contrast="high"] .panel,:root[data-contrast="high"] .feature{background:#0F1430}
:root[data-contrast="high"] #sky{opacity:.25} :root[data-contrast="high"] .backdrop{opacity:.5}
:root[data-contrast="high"] :focus-visible{box-shadow:0 0 0 2px #000,0 0 0 5px #FFE08A}
/* Worlds page */
.wstage{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--s-5);align-items:start}
@media (max-width:900px){.wstage{grid-template-columns:1fr}}
.wprev-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid rgba(231,201,131,.25);background:var(--sw),#06070C;min-height:340px;display:grid;align-items:end}
.wprev-wrap canvas{position:absolute;inset:0;width:100%;height:100%}
.wprev-cap{position:relative;padding:var(--s-5);display:grid;gap:6px;background:linear-gradient(0deg,rgba(6,7,12,.92),rgba(6,7,12,.55) 70%,transparent)}
.wprev-cap h2{font-size:clamp(28px,3.4vw,40px)}
@media (max-width:600px){.wprev-wrap{min-height:240px}}
.world .wthumb{display:block;width:100%;height:96px;background:var(--sw)}
.world[aria-pressed="true"]{border-color:var(--c-gold);box-shadow:0 0 0 1px var(--c-gold)}
.envlad{list-style:none;padding:0;display:grid;gap:4px}
.envlad li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border-radius:var(--r-sm);color:var(--c-muted)}
.envlad li small{display:block;font-size:var(--t-sm);color:var(--c-muted)}
.envlad li.on b{color:var(--c-text)} .envlad li.cur{background:rgba(231,201,131,.07);border:1px solid rgba(231,201,131,.3)}
.envlad .ei{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;border:1px solid var(--c-line)}
.envlad li.on .ei{color:var(--c-gold);border-color:rgba(231,201,131,.5)}
/* sequences */
#cine .cine{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:24px;background:radial-gradient(80% 70% at 50% 45%,rgba(20,26,56,.97),rgba(4,5,10,.985));animation:fade var(--d-base) both}
.cine-stage{display:grid;justify-items:center;gap:12px;text-align:center;max-width:680px}
.cine-art svg{width:min(420px,78vw);height:auto;overflow:visible}
.cine-eyebrow{font:600 13px var(--f-ui);color:var(--c-brass);letter-spacing:.03em}
.cine-title{font:500 clamp(34px,6vw,64px)/1.05 var(--f-display);color:var(--c-ivory);animation:cineIn calc(var(--dur)*.3) var(--ease-out) both;animation-delay:calc(var(--dur)*.12)}
.cine-line{font:400 18px/1.5 var(--f-read);color:var(--c-read);animation:fadeIn .6s ease both;animation-delay:calc(var(--dur)*.28)}
.cine-bar{position:absolute;left:24px;right:24px;bottom:calc(24px + env(safe-area-inset-bottom,0px));height:2px;background:rgba(255,255,255,.08)}
.cine-bar i{display:block;height:100%;background:var(--c-gold);transform-origin:left;animation:bar var(--dur) linear forwards}
.cine-skip{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px}
@keyframes cineIn{from{opacity:0;letter-spacing:.12em}} @keyframes fadeIn{from{opacity:0}} @keyframes bar{from{transform:scaleX(0)}}
.cine-art .a-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw calc(var(--dur)*.3) var(--ease-out) forwards;animation-delay:var(--d,0ms)}
@keyframes draw{to{stroke-dashoffset:0}}
.a-pop{transform-box:fill-box;transform-origin:center;animation:pop calc(var(--dur,1800ms)*.18) var(--ease-out) both;animation-delay:var(--d,0ms)} @keyframes pop{from{opacity:0;transform:scale(.3)}}
.a-rise{transform-box:fill-box;transform-origin:bottom;animation:riseUp calc(var(--dur)*.25) var(--ease-out) both;animation-delay:var(--d,0ms)} @keyframes riseUp{from{opacity:0;transform:scaleY(.1)}}
.a-grow{transform-box:fill-box;transform-origin:left;animation:growX calc(var(--dur)*.25) var(--ease-out) both;animation-delay:var(--d,0ms)} @keyframes growX{from{transform:scaleX(0)}}
.a-drop{animation:dropIn calc(var(--dur)*.18) var(--ease-out) both;animation-delay:var(--d,0ms)} @keyframes dropIn{from{opacity:0;transform:translateY(-30px)}}
.a-fade{animation:fadeIn calc(var(--dur)*.2) ease both;animation-delay:var(--d,0ms)}
.a-open-l{animation:openL calc(var(--dur)*.3) var(--ease-cine) forwards;animation-delay:var(--d,0ms)} @keyframes openL{to{transform:translateX(-46px);opacity:.3}}
.a-open-r{animation:openR calc(var(--dur)*.3) var(--ease-cine) forwards;animation-delay:var(--d,0ms)} @keyframes openR{to{transform:translateX(46px);opacity:.3}}
:root[data-motion="low"] .cine-art *,:root[data-motion="low"] .cine-title{animation-name:fadeIn!important;transform:none!important}
:root[data-motion="low"] .cine-art .a-draw{stroke-dashoffset:0}
/* learning visuals */
.svgwrap{overflow-x:auto;border:1px solid var(--c-line-soft);border-radius:var(--r-md);background:rgba(6,8,18,.6)}
.svgwrap svg{display:block;width:100%;min-width:540px;height:auto}
.svgwrap text{font-family:var(--f-ui)}
.mapbox path.lit,.svgwrap path.lit{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s var(--ease-out) forwards;animation-delay:var(--i,0ms)}
.flowline{stroke-dasharray:6 8;animation:flow 1.8s linear infinite} @keyframes flow{to{stroke-dashoffset:-28}}
:root[data-motion="static"] .mapbox path.lit,:root[data-motion="static"] .svgwrap path.lit,:root[data-motion="low"] .mapbox path.lit,:root[data-motion="low"] .svgwrap path.lit{animation:none;stroke-dashoffset:0}
:root[data-motion="static"] .flowline,:root[data-motion="low"] .flowline{animation:none}
:root[data-motion="static"] .a-pop{animation:none}
.meter{grid-template-columns:130px minmax(0,1fr) 44px}
.meter .fill{transition:width calc(var(--d-slow)*1.8) var(--ease-out)}
.dimchip{grid-column:2/-1;justify-self:start;font:600 12px var(--f-ui);padding:3px 8px;border-radius:var(--r-pill);border:1px solid var(--c-line);color:var(--c-muted)}
.dimchip.demo{color:var(--c-ok);border-color:rgba(130,219,168,.45)} .dimchip.dev{color:var(--c-gold);border-color:rgba(231,201,131,.35)}
.dimchip.newly{background:rgba(130,219,168,.12);animation:newly 1.6s var(--ease-out) both} @keyframes newly{0%{box-shadow:0 0 0 0 rgba(130,219,168,.55)}100%{box-shadow:0 0 0 10px rgba(130,219,168,0)}}
:root[data-motion="static"] .dimchip.newly{animation:none}
.curve circle{transition:transform calc(var(--d-slow)*2.2) var(--ease-out)}
/* ===================== Stage 5 · plans, checkout, Guardian, devices ===================== */
.simbar{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-md);border:1px dashed rgba(174,151,255,.55);background:rgba(174,151,255,.07);font-size:var(--t-sm);color:var(--c-read)}
.simbar .ico{flex:none;margin-top:2px;color:var(--c-violet)}
.stepper{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stepper li{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);font-size:var(--t-sm);color:var(--c-muted);min-width:0}
.stepper li .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--c-line);font:600 12px var(--f-mono);flex:none}
.stepper li.cur{border-color:var(--c-gold);color:var(--c-text)} .stepper li.cur .n{border-color:var(--c-gold);color:var(--c-gold)}
.stepper li.done{color:var(--c-read)} .stepper li.done .n{background:rgba(130,219,168,.14);border-color:rgba(130,219,168,.5);color:var(--c-ok)}
fieldset{border:0;padding:0;margin:0;min-width:0}
legend{padding:0;margin-bottom:6px}
.dob{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) minmax(0,1fr);gap:10px}
.dob legend{grid-column:1/-1;font-weight:600;font-size:var(--t-sm)}
@media (max-width:420px){.dob{grid-template-columns:1fr 1fr}.dob .field:first-of-type{grid-column:1/-1}}
.legalv{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.legalv li{display:flex;justify-content:space-between;gap:10px;padding:6px 10px;border-radius:var(--r-sm);background:rgba(255,255,255,.02);border:1px solid var(--c-line-soft);font-size:var(--t-sm)}
.pmcard{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px;border-radius:var(--r-md);border:1px solid var(--c-line)}
.pmcard.ok{border-color:rgba(130,219,168,.45)} .pmcard.bad{border-color:rgba(255,148,148,.55);background:rgba(255,148,148,.06)}
.pmcard > span{flex:1;min-width:0}
.terms{padding:12px 14px;border-radius:var(--r-md);background:var(--surf-read,#0D1124);border:1px solid var(--c-line-soft);display:grid;gap:6px}
.activate{display:grid;gap:8px;padding-top:6px;border-top:1px solid var(--c-line-soft)}
.check.consent{padding:12px;border-radius:var(--r-md);border:1px solid var(--c-line)}
.err-line{display:flex;gap:6px;align-items:flex-start;color:var(--c-danger);font-size:var(--t-sm);margin:0}
.err-line .ico{flex:none;margin-top:2px}
.email{border:1px solid var(--c-line);border-radius:var(--r-md);padding:12px 14px;background:#0B0E1C;display:grid;gap:6px;font-size:var(--t-sm)}
.email-h{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--c-line-soft);padding-bottom:6px}
.trialdash .tdgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--s-5);align-items:start}
@media (max-width:700px){.trialdash .tdgrid{grid-template-columns:1fr}}
.trialdash .progressbar{margin-top:8px}
.ladder{list-style:none;padding:0;margin:0;display:grid;gap:6px}
.ladder li{display:grid;gap:3px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--c-line-soft)}
.ladder li.cur{border-color:var(--c-warn);background:rgba(243,188,108,.06)} .ladder li.past{opacity:.75}
.alertpanel{border-color:rgba(243,188,108,.55)!important}
.proto-panel{border-style:dashed!important;border-color:rgba(174,151,255,.45)!important}

.checkout{align-items:start}

.scope{font-size:10.5px}
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--s-4)}
.ovcard{display:grid;gap:8px;align-content:start}

.concepts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.concept{display:grid;gap:4px;padding:12px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);background:rgba(231,201,131,.03)}
.note.flag{border-color:rgba(243,188,108,.5)}
.h4{font:600 15px var(--f-ui);margin:6px 0 0}
.modedit{display:grid;gap:8px;padding:12px;border:1px solid var(--c-line-soft);border-radius:var(--r-md)}

.pvframe.pv-contrast{background:#070910;border-color:#6A74B0;color:#fff}

.capreview{display:grid;gap:6px;padding:12px;border-radius:var(--r-md);border:1px solid rgba(231,201,131,.35);background:rgba(231,201,131,.04)}

.bars-h{display:grid;gap:6px}
.bh{display:grid;grid-template-columns:minmax(90px,150px) minmax(0,1fr) 48px;gap:10px;align-items:center;font-size:var(--t-sm)}
.bh .bl{color:var(--c-read);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bh .bt{height:10px;background:var(--c-surface-3);border-radius:0 4px 4px 0;overflow:hidden}
.bh .bt i{display:block;height:100%;background:var(--c-blue);border-radius:0 4px 4px 0}
.bh .bv{text-align:right;color:var(--c-text)}
.bh:hover .bt i{filter:brightness(1.2)}
.wfsel{margin-top:4px;max-width:100%}
table.audit td{vertical-align:top}

.boundary{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-radius:var(--r-md);border:1px solid rgba(231,201,131,.45);background:rgba(231,201,131,.06);font-size:var(--t-sm);color:var(--c-read)}
.boundary .ico{flex:none;margin-top:2px;color:var(--c-gold)}
.boundary p{margin:0}
.lgtools{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px}
@media (max-width:640px){.lgtools{grid-template-columns:1fr}}
.lggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.lgdoc{display:grid;gap:8px;align-content:start;padding:var(--s-4);border:1px solid var(--c-line-soft);border-radius:var(--r-md);background:var(--surf-panel,rgba(16,21,42,.9))}
.lgdoc h3{font:600 16px var(--f-ui);margin:2px 0 0}
.lgdoc[hidden],.lggroup[hidden]{display:none}
.h-sec{font:600 18px var(--f-ui);margin:0}
.lgitems{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.lgitems li{display:grid;gap:4px;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);font-size:var(--t-sm);line-height:1.5}
.lglabel{display:inline-flex;gap:6px;align-items:center;font:600 11px var(--f-mono);letter-spacing:.02em}
.lglabel .ico{width:14px;height:14px}
.lgr .lglabel{color:var(--c-ok)}
.lgc{border-style:dashed!important;border-color:rgba(243,188,108,.6)!important;background:rgba(243,188,108,.06)}
.lgc .lglabel{color:var(--c-warn)}
.lgp{background:rgba(174,151,255,.05)} .lgp .lglabel{color:var(--c-violet)}
.lgc-inline{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border:1px dashed rgba(243,188,108,.6);border-radius:var(--r-md);font-size:var(--t-sm)}
.lgsec:focus{outline:none}
.disclose{display:grid;gap:6px;padding:12px 14px;border-radius:var(--r-md);border:1px solid rgba(231,201,131,.5);background:rgba(231,201,131,.05)}
.disclose ul{margin:0;padding-left:18px;display:grid;gap:2px}
.ctxnote{display:flex;gap:10px;align-items:flex-start;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--c-line-soft);background:rgba(122,159,255,.05);color:var(--c-read)}
.ctxnote .ico{flex:none;margin-top:2px;color:var(--c-blue)}
@media print{#protobar,#side,#top,#tabbar,#sky,.backdrop,#cine,#toasts,.backrow,.lgtools,.chips,button{display:none!important}body,#main{background:#fff!important;color:#000!important}.panel,.lgitems li{border-color:#999!important;background:#fff!important;color:#000!important}}
#main select:not(.input){min-height:36px}
.jsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.jsgrid>div{display:grid;gap:4px;align-content:start;padding:12px;border:1px solid var(--c-line-soft);border-radius:var(--r-md)}
.jsgrid .bignum{line-height:1}

  oliver:{days:["Mon","Tue","Wed","Thu","Fri","Sat"],hours:"5–6",min:45},
  maya:{days:["Mon","Tue","Thu","Fri","Sat"],hours:"3–4",min:45},
  jordan:{days:["Mon","Tue","Wed","Thu","Fri"],hours:"5–6",min:60},
  eli:{days:["Mon","Tue","Wed","Thu","Fri","Sat"],hours:"3–4",min:30}
};
const SCHED_DEFAULT = {oliver:"onTrack",maya:"onTrack",jordan:"onTrack",eli:"missed3"};
const SCHED_STATES = [["onTrack","On track"],["missed3","Missed three days"],["missedWeek","Missed a week"],["overloaded","Overloaded plan"]];
const RECOVERY = {
  extend:{label:"Extend my finish date",line:"Keep every lesson and give yourself more weeks."},
  reduce:{label:"Drop optional work",line:"Keep required lessons, checks, reviews, and the capstone. Skip the optional extras."},
  redistribute:{label:"Spread the missed sessions out",line:"Add short sessions over the next two weeks. The finish date stays the same."},
  pause:{label:"Pause for a week",line:"Stop the schedule for a week. Five-minute reviews stay available if you want them."}
};
const OPTIONAL_WORK = ["Extra practice set in Qualification and Booking","Optional reading on review requests","Second scenario in Troubleshooting a Leaky Pipeline"];
function minutesFor(h){ return h==="1–2"?30:h==="7+"?60:45; }
function sessionsFor(h, days){ const n = {"1–2":2,"3–4":4,"5–6":5,"7+":6}[h]||4; return Math.max(1, Math.min(n, (days&&days.length)||n)); }
function availOf(acc){ const o = S.onb[acc.id]; if(o && o.status==="built" && o.a && o.a.days && o.a.days.length) return {days:o.a.days,hours:o.a.hours||"3–4",min:minutesFor(o.a.hours)}; return AVAIL[acc.id] || {days:["Mon","Wed","Fri"],hours:"3–4",min:45}; }
function schedOf(acc){ S.sched[acc.id] = S.sched[acc.id] || {state:SCHED_DEFAULT[acc.id]||"onTrack",choice:null}; return S.sched[acc.id]; }
function dayCell(acc, wk, i){
  const av = availOf(acc), sc = schedOf(acc), planned = av.days.includes(DAYS[i]), dt = WEEK_DATES[wk][i];
  const isToday = wk==="this" && i===TODAY_IDX, past = wk==="last" || (wk==="this" && i<TODAY_IDX);
  let st = planned ? "plan" : "rest";
  if(past && planned){ st = "done";
    if(sc.state==="missed3" && wk==="this" && i>=1 && i<=3) st = "miss";
    if(sc.state==="missedWeek" && ((wk==="last" && i>=3) || wk==="this")) st = "miss"; }
  if(isToday) st = S.sessionsToday[acc.id] ? "done" : planned ? "today" : "rest";
  if(!past && !isToday && planned){
    if(sc.state==="overloaded" && !sc.choice) st = "heavy";
    if(sc.choice==="redistribute" && sc.state!=="onTrack") st = "plus";
    if(sc.choice==="reduce") st = "light";
    if(sc.choice==="pause" && wk==="next") st = "paused"; }
  if(!past && !isToday && !planned && sc.state==="overloaded" && !sc.choice && wk==="this") st = "extra";

  const seed = p.seedless ? null : m.status;

function masteryOf(acc){
  const ac = currentAcademy(acc);
  if(!ac) return null;
  if(!isEngine(ac)){ const b = MASTERY[acc.id]; if(!b) return null; const d = S.masteryDelta[acc.id]||{}; const o = {}; for(const k in b) o[k] = Math.min(100, b[k]+(d[k]||0)); return o; }
  const mods = ac.modules, p = progOf(acc), mt = metricsOf(acc);
  const opened = (S.opened[acc.id]||[]).filter(id=>findMod(ac,id)).length;
  const firsts = mods.map(m=>p.first[ac.id+":"+m.id]).filter(v=>v!=null);

}

    return {from:"bot",guard:true,text:"I can't do graded work for you. It has to be yours to count as evidence of what you can do. I can explain the idea, show an example from a different business, or give hints one at a time.",hintFor:lid||null,refs:lid&&LESSONS[lid]?[mref(ac,lid)]:[]}; }
  const lid = mode==="ask" ? lessonMatch(ac,text) : ctx;
  if(!lid || !LESSONS[lid]) return {from:"bot",beyond:true,text: mode==="ask" ? "That goes beyond what your course covers, so I can't answer it from course evidence. Your course covers "+(coveredTopics(ac)||"the modules in your Blueprint")+". If you have a source you trust on this, add it in Archive and a reviewer can check it." : "There's no lesson content to work from yet. Choose a lesson in the “About” menu."};
  const L = LESSONS[lid], R = [mref(ac,lid)].concat(srcRefs(lid));
  if(mode==="explain") return {from:"bot",text:L.alt,refs:R,lid};
  if(mode==="example") return {from:"bot",text:"Example: "+L.example.b+" Counterexample: "+L.counter.b,refs:R,lid};
  if(mode==="quiz"){ if(!L.checks.length) return {from:"bot",text:"This lesson has no quiz questions. Try Ask Me Questions instead.",refs:R,lid}; const qi = (S.mquizN = ((S.mquizN||0)+1)) % L.checks.length; return {from:"bot",text:"Here's one, with a changed example. Choose an answer.",quiz:{lid,qi},refs:R,lid}; }
  if(mode==="socratic") return {from:"bot",text:"Let's think it through. Answer any of these in your own words below:",list:L.socratic,refs:R,lid};
  if(mode==="reflect") return {from:"bot",text:"Take a minute with these. Write your answer below and it's saved as a private note.",list:["What can you do now that you couldn't before this lesson?","What still feels unclear?","Where will you use this in the next week?"],reflect:lid,refs:R,lid};
  const t = (text||"").toLowerCase();
  if(L.conflict && (L.conflictKeywords||[]).some(k=>t.includes(k))){ const c = CONFLICTS[L.conflict], st = conflictState(c.id), d = latestDecision(c.id);
    if(st==="resolved") return {from:"bot",text:L.governed[d.choice]+" That's your course's standard since decision v"+d.version+". It was chosen over "+SOURCES[d.choice===c.a?c.b:c.a].title+".",refs:R,lid};
    return {from:"bot",unsure:true,text:"Your course sources disagree on this, so I can't give you one settled answer. "+SOURCES[c.a].title+" recommends a 5-minute standard. "+SOURCES[c.b].title+" found that a 1-hour standard with a useful first reply booked about as many home service jobs. Both agree on this much: route every channel to one place with one owner, and make the first reply useful. The lesson stays Needs Review until you or a reviewer choose.",refs:R,lid}; }
  return {from:"bot",text:L.summary+" That's from your course. Ask me to explain it differently or give an example if it doesn't click.",refs:R,lid};
}

    const L = LESSONS[m.id], ls = lsOf(acc,m.id);

    if(!ls.done) return {module:m.id,kind:"Lesson",title:L?L.title:m.title,minutes:L?L.minutes:20,why:m.conflict && moduleNeedsReview(m) ? "This lesson has an open source question. It teaches both views until a decision is recorded." : L && L.independent ? "A mastery check you do on your own. Hints lower your independence score." : "Next lesson in "+m.title+".",go:["lesson",m.id]};
    const todo = workFor(m).find(w=>{ const s = workStatus(acc,ac,w); return s==="available" || s==="inProgress"; });
    if(todo && isEngine(ac)) return {module:m.id,kind:WORK[todo].kind,title:WORK[todo].title,minutes:25,why:"Put "+m.title+" into practice. It produces something you keep.",go:["lab",todo]};
    return {module:m.id,kind:"Check",title:"Retake the "+m.title+" check",minutes:10,why:"80% opens the next module. The retake uses changed examples.",go:["lesson",m.id]};
  }
  if(isEngine(ac)){ const ms = masteryStatus(acc); const last = ac.modules[ac.modules.length-1];
    if(ms && !ms.mastered) return {module:last.id,kind:"Review",title:"Build retention with spaced review",minutes:15,why:"Every module is complete, but "+ms.gaps.map(g=>g.label.toLowerCase()).join(" and ")+" "+(ms.gaps.length>1?"are":"is")+" below the Mastery bar.",go:["review",null]};
    return {module:last.id,kind:"Continue",title:"Choose a specialization",minutes:10,why:"You've demonstrated Mastery. Go deeper in the same subject; it's included in your plan.",go:["academy",null]}; }
  const last = ac.modules[ac.modules.length-1]; return {module:last.id,kind:"Review",title:"Review what you've learned",minutes:15,why:"Everything in this academy is complete.",go:["review",null]};
}

V.coursemap = function(){

  const W = vertical?360:960, colN = cols.length, maxRows = Math.max(...cols.map(c=>c.mods.length),1), pos = {};
  cols.forEach((c,ci)=>c.mods.forEach((m,ri)=>{ if(vertical) pos[m.id] = {x:c.mods.length===1?W/2:(W/(c.mods.length+1))*(ri+1), y:70+ci*150}; else { const colW = W/colN; pos[m.id] = {x:colW*ci+colW/2, y:90+(ri+(maxRows-c.mods.length)/2)*150}; } }));
  const H = vertical ? 70+colN*150 : 90+maxRows*150;
  const S_ = m => modStatus(acc,ac,m);

  const lit = m => S_(m)!=="locked";
  let ei = 0; const edges = ac.modules.flatMap(m=>(m.prereq||[]).map(p=>{ const a = pos[p], b = pos[m.id]; if(!a||!b) return ""; const on = lit(findMod(ac,p)) && lit(m);

      <text x="${p.x}" y="${p.y+5}" text-anchor="middle" font-size="15" fill="${g[1]}">${g[2]}</text>${moduleNeedsReview(m)?`<text x="${p.x+20}" y="${p.y-16}" font-size="14" fill="#F3BC6C">!</text>`:""}
      ${lines.map((l,i)=>`<text x="${p.x}" y="${p.y+44+i*16}" text-anchor="middle" font-size="13" ${s==="locked"?'opacity=".7"':""}>${esc(l)}</text>`).join("")}</g>`; }).join("");
  const colLabels = cols.map((c,ci)=>vertical?`<text x="12" y="${70+ci*150-40}" font-size="11" fill="#C9A45C" style="letter-spacing:.14em">${esc(c.k.toUpperCase())}</text>`:`<text x="${(W/colN)*ci+(W/colN)/2}" y="30" text-anchor="middle" font-size="11" fill="#C9A45C" style="letter-spacing:.14em">${esc(c.k.toUpperCase())}</text>`).join("");

/* ---------- Source health ---------- */
function srcHealth(s){ if(!s) return "";
  const cs = Object.values(CONFLICTS).filter(c=>c.a===s.id||c.b===s.id);
  for(const c of cs){ const st = conflictState(c.id), d = latestDecision(c.id);
    if(st!=="resolved") return tag("warn","!","Disputed");
    return d.choice===s.id ? tag("ok","✓","Governs this lesson") : tag("disc","⊘","Not used for this lesson"); }
  if(s.health==="dated") return tag("doc","◷","Dated: check newer evidence");
  if(s.health==="learner") return tag("proto","◈","Yours: not independently checked");
  if(!s.sample) return represented();
  return tag("ok","✓","Current"); }

  else { const s = S.savedExpl[acc.id]||[]; body = s.length?`<div class="stack">${s.map(x=>`<div class="note"><b>${esc(x.q)}</b><span style="font:400 15px/1.5 var(--f-read)">${esc(x.a)}</span><span class="small muted">Demo responder · scripted from course content</span></div>`).join("")}</div>`:emptyCard("No saved explanations","Save a Mentor explanation to keep it here."); }

function decisionLabel(c, d){ return d.type==="reopen" ? "Reopened" : d.choice==="reviewer" ? "Sent to a reviewer" : "Source "+(d.choice===c.a?"A":"B")+" governs"; }
function conflictHTML(c, viewer){
  const A = SOURCES[c.a], B = SOURCES[c.b], d = latestDecision(c.id), st = conflictState(c.id), acc = me();
  const learnerOk = viewer==="learner" && (acc.kind==="adult"||acc.kind==="owner") && academiesOf(acc).some(x=>x.id===c.academy);
  const reviewerOk = viewer==="reviewer" && can(acc,"reviewSources") && roleKeyOf(acc)!=="courseAdmin";
  const mayDecide = learnerOk || reviewerOk, err = S.cfErr && S.cfErr.id===c.id ? S.cfErr : null;

    <div class="ind" aria-label="Evidence indicators">${s.indicators.map(i=>`<span>${esc(i)}</span>`).join("")}</div>${badge("demo","sample source")}</div>`;
  let status = "";
  if(st==="resolved") status = notice("gold","scale",`<b>Decision v${d.version}: Source ${d.choice===c.a?"A":"B"} governs this lesson.</b> Recorded by ${esc(d.by)} · ${esc(d.at)}.${d.rationale?" Rationale: “"+esc(d.rationale)+"”":""} ${badge("simulated","local record")}`);
  else if(st==="pending") status = notice("warn","review",`<b>Sent to a Learning Reviewer</b> by ${esc(d.by)} · ${esc(d.at)}. The lesson stays Needs Review until a reviewer decides.`);
  else if(d && d.type==="reopen") status = notice("warn","scale",`<b>Reopened</b> by ${esc(d.by)} · ${esc(d.at)}. Evidence: “${esc(d.note||"")}” Earlier decisions stay in the history.`);
  let actions = "";
  if(st!=="resolved"){
    if(mayDecide) actions = `<div class="stack"><div class="field"><label for="cfr_${c.id}">Why this source should govern the course</label><textarea id="cfr_${c.id}" rows="2" placeholder="For example: it studies home service businesses and measures booked jobs." ${err&&err.kind==="r"?'aria-invalid="true"':""}></textarea>${err&&err.kind==="r"?`<span class="err" role="alert">${esc(err.msg)}</span>`:""}</div>
      <div class="row">${btn("Source A governs","decide",c.id+"|"+c.a,{id:"dA_"+c.id})}${btn("Source B governs","decide",c.id+"|"+c.b,{id:"dB_"+c.id})}${viewer==="learner"&&st==="open"?btn("Ask a reviewer instead","decide",c.id+"|reviewer",{cls:"ghost",id:"dR_"+c.id}):""}</div></div>`;
    else if(roleKeyOf(acc)==="courseAdmin") actions = `<div class="row">${btn("Request a reviewer decision","requestReview",c.id,{cls:"small",id:"reqRev_"+c.id})}<span class="small muted">Course Admins can flag conflicts. The learner or a Learning Reviewer decides.</span></div>`;
    else actions = `<p class="small muted">${badge("restricted")} Only an adult learner in this course or a Learning Reviewer can decide which source governs.</p>`;
  } else if(mayDecide || reviewerOk){
    actions = `<details class="reopen" ${err&&err.kind==="o"?"open":""}><summary class="small"><b>Reopen this decision</b> (for materially newer evidence)</summary><div class="stack" style="margin-top:8px"><div class="field"><label for="cfo_${c.id}">What newer evidence prompted this?</label><textarea id="cfo_${c.id}" rows="2" ${err&&err.kind==="o"?'aria-invalid="true"':""}></textarea>${err&&err.kind==="o"?`<span class="err" role="alert">${esc(err.msg)}</span>`:""}</div><div>${btn("Reopen decision","reopen",c.id,{cls:"small",id:"reopen_"+c.id})}</div></div></details>`; }
  const log = decisionLog(c.id);
  return `<section class="panel" aria-labelledby="cf_${c.id}">
    <div class="panel-head"><div><div class="eyebrow">Source conflict · ${esc(ACADEMIES[c.academy].name)} · Module ${findMod(ACADEMIES[c.academy],c.module).n}</div><h3 id="cf_${c.id}">${esc(c.lesson)}</h3></div>${st==="resolved"?badge("complete","resolved"):badge("needsReview")}</div>
    ${convergeSVG(c, st, d)}
    <div class="claims">${claim(A,"A")}${claim(B,"B")}</div>
    <div class="stack"><b>Why they may disagree</b><ul class="list">${c.why.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>
    ${st!=="resolved"?`<p class="read">${esc(c.rationale)}</p>`:""}${status}${actions}
    ${log.length?`<details ${S.openHist?"open":""}><summary class="small">Decision history (${log.length})</summary>${tbl(["Version","Action","By","When","Rationale or evidence"],log.map(x=>["v"+x.version,decisionLabel(c,x),esc(x.by),esc(x.at),esc(x.rationale||x.note||"—")]))}</details>`:""}
  </section>`;
}

/* ---------- Interview ---------- */
function ivQ(t,h){ return `<h2 class="ivq" id="ivq">${esc(t)}</h2>${h?`<p class="muted">${esc(h)}</p>`:""}`; }
function ivChoice(field, opts, cur){ return `<div class="choices" role="radiogroup" aria-labelledby="ivq">${opts.map(([v,l,s])=>`<button type="button" class="choice" role="radio" aria-checked="${cur===v}" data-act="ivPick" data-arg="${field}|${esc(v)}" id="ivc_${field}_${String(v).replace(/[^a-z0-9]/gi,"")}"><b>${esc(l)}</b>${s?`<small>${esc(s)}</small>`:""}</button>`).join("")}</div>`; }
function ivStep(o, key){ const a = o.a;
  switch(key){
    case "goal": return ivQ("What do you want to be able to do?","Plain words are fine. For example: “get more jobs from the people who contact us.”")+`<label for="iv_goal" class="sr">Your goal</label><textarea id="iv_goal" rows="3">${esc(a.goal)}</textarea>`;
    case "outcome": { if(!a.outcome) a.outcome = proposeOutcome(a); return ivQ("Here's your goal as an outcome you can check","We turned it into something you'll be able to show. Change any words that don't fit.")+`<label for="iv_outcome" class="sr">Outcome</label><textarea id="iv_outcome" rows="3">${esc(a.outcome)}</textarea><div>${btn("Suggest again from my goal","ivResuggest",null,{cls:"small ghost",id:"ivRes"})}</div>`+(topicOf(a)==="other"?notice("warn","info","ASCENTRA's first academy covers business and professional skills. This goal is outside that, so sources and practice would be thinner than usual."):""); }
    case "why": return ivQ("Why does this matter now?","This helps pick examples that fit.")+ivChoice("why",[["business","A business need right now"],["career","A career move"],["deadline","A deadline or event"],["curious","I'm curious"]],a.why)+`<div class="field"><label for="iv_whyText">Anything to add? (optional)</label><textarea id="iv_whyText" rows="2">${esc(a.whyText)}</textarea></div>`;
    case "exp": return ivQ("How much have you done this before?")+ivChoice("exp",[["new","New to this","I haven't done it before"],["some","Tried it a bit","Some experience, not a routine"],["regular","I do this regularly","I want to get better at it"]],a.exp)+`<div class="field"><label for="iv_evidence">What have you done before? (optional)</label><textarea id="iv_evidence" rows="2">${esc(a.evidence)}</textarea><span class="hint">Past work helps the diagnostic. You can also share an example there.</span></div>`;
    case "time": return ivQ("How much time can you give it each week?")+ivChoice("hours",[["1–2","1–2 hours"],["3–4","3–4 hours"],["5–6","5–6 hours"],["7+","7 or more"]],a.hours)+`<fieldset class="daypick"><legend>Which days usually work?</legend>${DAYS.map(d=>`<label for="ivd_${d}"><input type="checkbox" id="ivd_${d}" data-change="ivDay" data-arg="${d}" ${a.days.includes(d)?"checked":""}><span>${d}</span></label>`).join("")}</fieldset>`;
    case "window": return ivQ("When would you like to finish?")+ivChoice("window",[["6 weeks","6 weeks"],["3 months","3 months"],["6 months","6 months"],["No fixed date","No fixed date"]],a.window);
    case "balance": return ivQ("How do you like to learn?","Set each from 0 (a little) to 4 (a lot). Every academy still includes practice and checks; this changes the mix.")+`<div class="stack">${BAL.map(([k,l])=>`<div class="slider"><label for="ivb_${k}">${l}</label><input type="range" id="ivb_${k}" min="0" max="4" step="1" value="${a.balance[k]}" data-change="ivBal" data-arg="${k}"><span class="num small">${a.balance[k]}</span></div>`).join("")}</div>`;
    case "context": return ivQ("Tell us about your situation","Examples will come from your world.")+`<div class="field"><label for="iv_industry">Industry or business</label><input type="text" id="iv_industry" value="${esc(a.industry)}" placeholder="For example: residential roofing"></div><span class="lbl">Your role</span>`+ivChoice("role",[["owner","Owner"],["employee","Employee"],["freelancer","Freelancer"],["student","Student"],["other","Other"]],a.role);
    case "materials": return ivQ("Any materials you already trust?","Links, notes, documents, or videos. Optional.")+`<div class="field"><label for="iv_materials">Links or notes, one per line</label><textarea id="iv_materials" rows="3">${esc(a.materials)}</textarea></div><div class="field"><label for="iv_files">Files</label><input type="file" id="iv_files" multiple data-change="ivFiles"></div>${a.files.length?`<ul class="list small">${a.files.map(f=>`<li>${esc(f)} ${tag("disc","⊘","Not read")}</li>`).join("")}</ul>`:""}${notice("sim","info",`They'll be listed as your sources. In this prototype nothing is read or uploaded: file processing is Disconnected. ${badge("disconnected")}`)}`;
    case "access": return ivQ("Anything that makes studying easier for you?","Optional. These set your comfort defaults, and you can change them any time.")+`<div class="stack">${ACCESS.map(([k,l])=>`<label class="check" for="iva_${k}"><input type="checkbox" id="iva_${k}" data-change="ivAccess" data-arg="${k}" ${a.access.includes(k)?"checked":""}><span>${l}</span></label>`).join("")}</div>`;
    case "project": return ivQ("What would you like to have built by the end?","Your capstone. It can change later.")+`<label for="iv_project" class="sr">Final project</label><textarea id="iv_project" rows="3">${esc(a.project)}</textarea><div class="chips">${(topicOf(a)==="automation"?["An onboarding flow that runs on its own","A time-saved report for one workflow"]:["A 90-day plan to book more jobs","A lead handling playbook for my team"]).map(s=>btn(s,"ivSuggest",s,{cls:"small ghost"})).join("")}</div>`;
  } return ""; }
function ivSummary(a, key){ const L = (arr,v)=>(arr.find(x=>x[0]===v)||[0,"—"])[1];
  switch(key){ case "goal": return a.goal||"—"; case "outcome": return a.outcome||"—"; case "why": return (L([["business","A business need right now"],["career","A career move"],["deadline","A deadline or event"],["curious","Curiosity"]],a.why))+(a.whyText?" · "+a.whyText:"");
    case "exp": return L([["new","New to this"],["some","Tried it a bit"],["regular","Does this regularly"]],a.exp)+(a.evidence?" · "+a.evidence:""); case "time": return (a.hours?a.hours+" hours a week":"—")+" · "+(a.days.join(", ")||"no days chosen"); case "window": return a.window||"—";
    case "balance": return BAL.map(([k,l])=>l+" "+a.balance[k]).join(" · "); case "context": return [a.industry, L([["owner","Owner"],["employee","Employee"],["freelancer","Freelancer"],["student","Student"],["other","Other"]],a.role)].filter(x=>x&&x!=="—").join(" · ")||"Skipped";
    case "materials": { const n = (a.materials||"").split("\n").filter(s=>s.trim()).length + a.files.length; return n ? n+" item"+(n>1?"s":"")+" listed" : "None"; }

/* ---------- Diagnostic ---------- */
const DIAG_STEPS = ["why","conf","mcq","order","scen","upload","profile"];
V.diagnostic = function(){
  const acc = me(), o = onbOf(acc);
  if(!o || !["diagnostic","blueprint","building","built"].includes(o.status)) return `${pageCrumbs("diagnostic")}${emptyCard("Finish the interview first","The diagnostic uses your goal to choose its questions.",goBtn("Go to the interview","interview",null,{cls:"primary"}))}`;
