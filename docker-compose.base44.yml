# Base44 sandbox environment for ASCENTRA.
#
# The app runs from this checkout (node:22, `next dev`, live reload) on host port 3000 against a
# local stand-in for Supabase's Data API: Postgres 17 with pgvector, every migration applied, and
# PostgREST behind a small nginx gateway that serves it under /rest/v1 — the same shape
# tests/integration/stack.ts builds in Node, so lib/db talks to it unchanged.
#
# Clerk, Stripe, Resend and Anthropic are external services and are NOT emulated: see AGENTS.md.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
name: ascentra-base44

configs:
  # The app's entry point on host port 3000. The sandbox's proxy reaches the container over plain
  # HTTP and forwards no X-Forwarded-Proto, so the app would believe every request arrived over http.
  # Clerk builds its sign-in handshake redirect from that scheme, and an http redirect inside the
  # https preview never completes; this hop restores the header. Everything else is passed through.
  entry_conf:
    content: |
      # NB: "$$" so Compose leaves the nginx variables alone.
      map $$http_upgrade $$connection_upgrade { default upgrade; '' close; }
      server {
        listen 80;
        server_name _;
        # Docker's embedded DNS: the app's address must be re-resolved, because replacing its
        # container (which the platform does when secrets land) gives it a new one.
        resolver 127.0.0.11 valid=5s ipv6=off;
        location / {
          set $$web_upstream http://web:3001;
          proxy_pass $$web_upstream;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-Proto https;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
        }
      }

  # Serves PostgREST under the path Supabase uses (/rest/v1), which postgrest-js expects.
  gateway_conf:
    content: |
      server {
        listen 80;
        server_name _;
        location = /rest/v1 { proxy_pass http://rest:3000/; }
        location /rest/v1/ { proxy_pass http://rest:3000/; }
        # Supabase Auth (GoTrue) is not part of this stand-in, so /api/v1/health reports the project as
        # Disconnected. Say so in JSON instead of a bare HTML 404.
        location /auth/v1/ {
          default_type application/json;
          return 404 '{"error":"not_emulated","message":"The sandbox stand-in serves only /rest/v1; Supabase Auth is not emulated."}';
        }
        location / { return 404; }
      }

volumes:
  pgdata:

services:
  # Postgres 17 with pgvector, the engine CI uses (pgvector/pgvector:pg17).
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: on-failure
    labels:
      base44.kind: infra

  # One-shot: Supabase's API roles and auth.jwt(), every migration in order, PostgREST's login role.
  # Safe to re-run, so `up` on an existing volume is a no-op.
  db-setup:
    image: pgvector/pgvector:pg17
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./:/repo:ro
    command: ["sh", "/repo/scripts/base44/db-setup.sh"]
    labels:
      base44.kind: infra

  # PostgREST, the Data API engine. It switches into the role named in the JWT's "role" claim,
  # exactly as Supabase does, so the app's service-role client behaves the same here.
  rest:
    image: postgrest/postgrest:v12.2.3
    depends_on:
      db-setup:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgresql://authenticator:ascentra_local@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: d46a832971a37ef59efe4a99c20efc93f263dfc368c422bbf06a56697308c9a2
      PGRST_SERVER_HOST: 0.0.0.0
      PGRST_SERVER_PORT: "3000"
      PGRST_LOG_LEVEL: error
      PGRST_DB_POOL: "5"
    restart: on-failure
    labels:
      base44.kind: infra

  # The /rest/v1 path Supabase clients expect. Its healthcheck reaches through to PostgREST,
  # so a healthy gateway means the Data API is answering.
  gateway:
    image: nginx:alpine
    depends_on:
      rest:
        condition: service_started
    ports:
      - "8000:80"
    configs:
      - source: gateway_conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/rest/v1/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: on-failure
    labels:
      base44.kind: api

  # The app: this checkout, bind-mounted, running Next's dev server with live reload.
  web:
    image: node:22
    working_dir: /app
    command: ["sh", "-ec", "npm ci --no-audit --no-fund --prefer-offline && exec npx next dev --port 3001 --hostname 0.0.0.0"]
    depends_on:
      db-setup:
        condition: service_completed_successfully
      gateway:
        condition: service_healthy
    expose:
      - "3001"
    volumes:
      - ./:/app
    env_file:
      # Placeholders so the app boots; the platform's secrets are read last, so they always win.
      - path: ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    environment:
      # Passed through from the sandbox so the dev server accepts the preview's host and origin.
      - BASE44_PREVIEW_MODE
      - BASE44_PUBLIC_HOST_SUFFIX
      - BASE44_SANDBOX_HOST_DOMAIN
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      # The real page, through Clerk's middleware: proves Next is serving and not erroring.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: on-failure
    labels:
      base44.project: ASCENTRA
      base44.kind: web
      base44.port: "3000"

  # The preview's front door: host port 3000, adding the https signal the sandbox proxy drops.
  entry:
    image: nginx:alpine
    depends_on:
      web:
        condition: service_started
    ports:
      - "3000:80"
    configs:
      - source: entry_conf
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      # The app's own page through the proxy: proves the front door reaches Next.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 240s
    restart: on-failure
    labels:
      base44.kind: api
